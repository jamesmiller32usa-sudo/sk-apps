<style>
:root{
  --top:#21263c; --side:#f7f7fc; --side-line:#ebebf3; --text:#21263c; --muted:#6c718a; --line:#ebeaf2;
  --blue:#408dfb; --blue-dark:#2c75e4; --head:#f9f9fb; --hover:#f4f4fa; --green:#1a9c5b; --red:#e04b4b; --orange:#f58a07;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;color:var(--text);background:#fff}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
svg{flex-shrink:0}

/* top bar */
.top{height:50px;background:var(--top);display:flex;align-items:center;color:#fff;position:fixed;inset:0 0 auto 0;z-index:30}
.logo{width:220px;display:flex;align-items:center;gap:10px;padding-left:18px;font-size:18px;font-weight:600}
.logo svg{stroke:#fff}
.tsearch{display:flex;align-items:center;gap:8px;background:#2c3247;border:1px solid #3b4258;border-radius:6px;height:32px;width:300px;padding:0 10px;margin-left:16px;color:#aeb3c6}
.tsearch input{background:none;border:none;outline:none;color:#fff;width:100%}
.tsearch input::placeholder{color:#8e94ab}
.tright{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:14px}
.org{padding:0 14px;border-right:1px solid #3b4258;margin-right:8px;font-size:14px;color:#e6e8f0}
.conn{font-size:12px;color:#aeb3c6;padding:0 12px}
.conn b{color:#7fd8a6;font-weight:500}
.ticon{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;cursor:pointer;color:#d4d7e3}
.ticon:hover{background:#2f3550}
.saving{color:#c9cede;font-size:12px}
.nav-ar{margin-left:6px;width:30px}.nav-ar+.nav-ar{margin-left:0}.nav-ar.off{opacity:.35;cursor:default}.nav-ar.off:hover{background:none}
.plus{background:var(--blue);color:#fff}
.plus:hover{background:var(--blue-dark)}
#login{position:fixed;inset:0;z-index:999;background:#f4f5fa;display:flex;align-items:center;justify-content:center}
.lcard{width:360px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:8px;padding:34px 32px 30px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lcard h2{margin:22px 0 4px;font-size:22px;font-weight:500}.lcard .in{width:100%;height:40px;margin-bottom:12px}
.llogo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;color:#21263c}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:600;margin-left:6px}

/* sidebar */
.side{position:fixed;top:50px;bottom:0;left:0;width:220px;background:var(--side);border-right:1px solid var(--side-line);padding:12px 10px;overflow:auto;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px 0 22px;border-radius:7px;color:#30344a;cursor:pointer;font-size:14px;position:relative;user-select:none}
.nav:hover{background:#ececf6;text-decoration:none}
.nav .chev{position:absolute;left:6px;color:#8b90a5}
.nav svg.i{stroke:#4c5168}
.nav.on{background:var(--blue);color:#fff}
.nav.on svg.i{stroke:#fff}
.hhero{padding:18px 28px 0;border-bottom:1px solid var(--line);background:#fbfbfe}
.hlogo{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.htabs{display:flex;gap:22px;margin-top:14px}.htabs div{padding:10px 0;font-size:15px;color:#30344a}.htabs div.on{border-bottom:3px solid var(--blue);color:#21263c}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:22px 28px 40px;max-width:1120px}
.hcard{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.hhead{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;background:#f9f9fb;border-bottom:1px solid var(--line)}.hhead h3{margin:0;font-size:16px;font-weight:500}
.hnew{display:flex;align-items:center;gap:5px;font-size:14px;color:#21263c;cursor:pointer}.hnew svg{background:var(--blue);stroke:#fff;border-radius:50%;padding:1px}
.hhead select.hsel{border:0;background:transparent;font-size:13px;font-weight:400;line-height:1.2;color:#30344a;cursor:pointer;max-width:200px;height:auto;padding:2px 4px;width:auto}
.hdot{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
table.hlist td{padding:11px 22px}
.sub{padding-left:52px;height:34px;font-size:13.5px}
.sub.on{background:#e3ecfd;color:var(--blue)}
.configure{margin-top:auto;background:#ebebfa;border-radius:7px;padding:11px 14px;color:#30344a;font-size:13.5px}

/* page */
.page{margin-left:220px;padding-top:50px;min-height:100vh}
.ph{display:flex;align-items:center;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:50px;z-index:10;min-height:66px}
.ph h1{font-size:20px;font-weight:600;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.pc{padding:20px 24px}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid #d9d9e3;background:#f7f7fa;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{background:#efeff4}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-dark)}
.btn.link{border:none;background:none;color:var(--blue);padding:0 4px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.closex{color:var(--red);cursor:pointer;padding:4px;display:grid;place-items:center}
.box{border:1px solid var(--line);border-radius:8px;background:#fff}
.dd{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;display:inline-block}

/* overview */
.ov-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ov-head h3{margin:0;font-size:17px;font-weight:500;flex:1}
.ov-cards{display:flex;gap:44px;padding:22px 20px}
.ov-card{display:flex;align-items:center;gap:12px}
.ov-ic{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;background:#f1f1f6}
.ov-ic.g{background:#e3f6ec}
.ov-card .k{font-size:12.5px;color:#41465d}
.ov-card .v{font-size:16px;font-weight:600;margin-top:2px}
.sect{font-size:17px;font-weight:500;margin:26px 0 10px;display:flex;align-items:center;gap:6px}

/* tables */
table{width:100%;border-collapse:collapse}
th{background:var(--head);color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#fafafd}
tr.click{cursor:pointer}
tr.sel{background:#eef4ff !important}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--muted)}
.sm{font-size:12px}
.acc-ic{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:#4c5168}
.acc-cell{display:flex;align-items:center;gap:14px}
.rowmenu{position:relative}
.circ{width:24px;height:24px;border:1.5px solid #4c5168;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:#fff}
.menu{position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:170px;padding:5px;z-index:40}
.menu div{padding:8px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu div:hover{background:var(--blue);color:#fff}
.tabs{display:flex;gap:26px;padding:0 20px;border-bottom:1px solid var(--line)}
.tabs div{padding:13px 0;cursor:pointer;color:#41465d;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs div.on{border-color:var(--blue);color:var(--text);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:#e9e9f1;font-size:11.5px;text-align:center;margin-left:4px;font-weight:500}
.filters{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.in{border:1px solid #d9d9e3;border-radius:6px;height:32px;padding:0 10px;background:#fff}
.in:focus{outline:none;border-color:var(--blue)}
.st-unc{color:var(--orange)}
.amt-in{color:var(--text)}
.bulkbar{display:none;align-items:center;gap:10px;padding:10px 20px;background:#f3f7ff;border-bottom:1px solid var(--line)}
.bulkbar.on{display:flex}
.det .t{font-weight:500}
.det .s{font-size:12px;color:var(--muted);margin-top:2px;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11.5px;background:#eef0f6;color:#41465d}
.tag.b1{background:#e8f1ff;color:#2c66c9}
.tag.b2{background:#f1ecff;color:#6a45c9}

/* side panel (categorize) */
.panel{position:fixed;top:50px;right:0;bottom:0;width:470px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:25;display:flex;flex-direction:column}
.panel .hd{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel .hd h3{margin:0;font-size:16px;font-weight:600;flex:1}
.panel .bd{padding:18px 20px;overflow:auto;flex:1}
.panel .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.sumbox{background:#f9f9fb;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:18px}
.sumbox .a{font-size:18px;font-weight:600}
.frow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:14px}
.frow label{color:#41465d}
.frow label.req{color:var(--red)}
.frow .in,.frow select{width:100%}
.seg{display:flex;border:1px solid #d9d9e3;border-radius:6px;overflow:hidden}
.seg div{flex:1;text-align:center;padding:7px 0;cursor:pointer;border-right:1px solid #d9d9e3}
.seg div:last-child{border-right:none}
.seg div.on{background:var(--blue);color:#fff}
.hint{font-size:12px;color:var(--muted)}
.page.wp{margin-right:470px}

/* modal */
.spick{position:fixed;z-index:200;background:#fff;border:1px solid #c9ccd8;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);display:flex;flex-direction:column;max-height:340px}
.spick input{margin:6px;height:32px;border:1px solid #408dfb;border-radius:4px;padding:0 9px;outline:none;font:inherit}
.spick .sl{overflow:auto;padding:0 4px 6px}
.spick .sg{padding:7px 8px 3px;font-size:11px;font-weight:600;color:#6b7086;text-transform:uppercase}
.spick .so{padding:7px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spick .so.hl{background:#408dfb;color:#fff}.spick .so.cur{font-weight:600}.spick .so.dis{color:#aaa;cursor:default}
.spick .none{padding:10px;color:#888}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:60px 16px;overflow:auto}
.modal{background:#fff;border-radius:8px;width:100%;max-width:600px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .hd{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.modal .hd h3{margin:0;font-size:16px;font-weight:600;flex:1}
.modal .bd{padding:20px}
.modal .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fafafc;border-radius:0 0 8px 8px}

/* import */
.steps{display:flex;justify-content:center;align-items:center;gap:12px;padding:6px 0 4px}
.step{display:flex;align-items:center;gap:7px;color:#9a9eb2}
.step b{width:22px;height:22px;border-radius:50%;border:1px solid #c6c8d6;display:grid;place-items:center;font-size:11.5px;font-weight:500}
.step.on{color:var(--text);font-weight:600}
.step.on b{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done b{background:#e3f6ec;border-color:#e3f6ec;color:var(--green)}
.stepline{width:60px;height:1px;background:#d9d9e3}
.imp{max-width:640px;margin:26px auto}
.drop{border:1px dashed #b9bccd;border-radius:6px;padding:34px;text-align:center;background:#fff}
.drop.over{background:#f3f7ff;border-color:var(--blue)}
.dlic{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;place-items:center;margin:0 auto 12px}
.tips{background:#f9f9fb;border-radius:6px;padding:14px 18px;margin-top:22px}
.tips ul{margin:8px 0 0;padding-left:18px;line-height:1.8;color:#41465d}
.footbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:8px;z-index:9}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:13px}
.alert.ok{background:#e9f7ef;color:#16774a;border:1px solid #c8ebd7}
.alert.bad{background:#fdeeee;color:#b93232;border:1px solid #f6cfcf}
.alert.info{background:#eef4ff;color:#2c5fae;border:1px solid #d3e3fd}
.kv{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
.kv div{padding:11px 14px;border-right:1px solid var(--line)}
.kv div:nth-child(4n){border-right:none}
.kv div:nth-child(n+5){border-top:1px solid var(--line)}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-size:14px}

/* report */
.rep{max-width:760px;margin:10px auto;border:1px solid var(--line);border-radius:6px;padding:30px 36px}
.rep .t{text-align:center}
.rep .t h2{margin:0;font-size:20px;font-weight:500}
.rep .t div{color:var(--muted);margin-top:4px}
.rep table td{border-bottom:1px solid #f0f0f5;padding:9px 6px}
.rep table th{background:none;border-top:none;padding:9px 6px}
.rep .grp td{font-weight:600;padding-top:18px;border-bottom:none}
.rep .tot td{font-weight:600;border-top:1px solid #cfd1dc}
.rep .net td{font-weight:700;font-size:14px;border-top:2px solid var(--text);border-bottom:none}
.pill-tabs{display:inline-flex;border:1px solid #d9d9e3;border-radius:6px;overflow:hidden}
.pill-tabs div{padding:6px 14px;cursor:pointer;border-right:1px solid #d9d9e3;background:#fff}
.pill-tabs div:last-child{border-right:none}
.pill-tabs div.on{background:var(--blue);color:#fff}

.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);font-weight:500;margin:0 0 6px}
.note{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#22a565;color:#fff;padding:9px 18px;border-radius:5px;z-index:99;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.note.err{background:var(--red)}
/* accountant */
.lk{color:#9a9eb2;display:grid;place-items:center}
.gear{color:#8b90a5;cursor:pointer;display:grid;place-items:center;width:26px;height:26px;border-radius:5px}
.gear:hover{background:#ececf6;color:var(--text)}
.tip{background:#21263c;color:#fff;border-radius:6px;padding:12px 14px;font-size:12.5px;line-height:1.5}
.tip b{display:block;margin-bottom:4px}
.modal.wide{max-width:820px}
.hsel{font-size:20px;font-weight:600;border:none;background:none;cursor:pointer;padding:0 4px 0 0}
.hsel:focus{outline:none}
.jl td{padding:6px 8px;vertical-align:top}
.jl th{padding:9px 8px}
.jl .in,.jl select{width:100%}
.jl .in.r{text-align:right}
.jtot{display:grid;grid-template-columns:1fr 150px 150px;gap:0;max-width:560px;margin-left:auto;background:#f9f9fb;border-radius:6px;padding:12px 16px;margin-top:12px}
.jtot div{padding:5px 0}
.jtot .r{text-align:right}
.grid{overflow:auto;border:1px solid var(--line);border-radius:6px;max-height:calc(100vh - 260px)}
.bg{border-collapse:separate;border-spacing:0;min-width:100%}
.bevbar{padding:10px 0;border:none}.bge td .gin{width:100%}
.bvone{display:inline-flex}.bvone .btn{border-radius:0;margin:0}.bvone .btn:first-child{border-radius:5px 0 0 5px}.bvone .btn:last-child{border-radius:0 5px 5px 0;border-left:none}.bvone .btn.on{background:#408dfb;color:#fff;border-color:#408dfb}
.bvstep{display:inline-flex;gap:4px;align-items:center}.bvstep .btn{padding:0 8px}.flip{transform:rotate(180deg)}
.bva{table-layout:fixed;width:auto;min-width:0}
.bva col.ca{width:300px}.bva col.cv{width:130px}
.rep table.bva th,.bva th{font-size:11px;color:#615d82;font-weight:600;text-align:center;padding:9px 8px;border-left:1px solid #ebeaf2;border-bottom:1px solid #fff}
.rep table.bva th.r{text-align:right;padding-right:12px}
.bva td{font-size:13px;padding:11px 12px;border-left:1px solid #ebeaf2;border-bottom:1px solid #ebeaf2;overflow:hidden;text-overflow:ellipsis}
.bva thead tr:first-child th:first-child{text-align:left;padding-left:20px;border-left:none}.bva tbody td:first-child{border-left:none;min-width:0}
.rep table.bg tr.t td:first-child{text-align:left}
.bvwrap{position:relative}
.bvarr{position:absolute;top:50%;z-index:6;width:40px;height:72px;margin-top:-36px;border:none;border-radius:4px;background:rgba(240,240,245,.92);box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;display:grid;place-items:center;color:#555}
.bvarr:hover{background:#e6e8f0}.bvarr.r{right:14px}
.zoombar{display:inline-flex;align-items:center;gap:6px;margin-left:auto}.zoombar .btn.sm{height:28px;padding:0 9px}.zval{min-width:44px;text-align:center;font-weight:600}
.bg th,.bg td{border-bottom:1px solid var(--line);padding:7px 10px;white-space:nowrap}
.bg th,.rep table.bg th{position:sticky;top:0;z-index:3;border-top:none;background:var(--head)}
.bg thead tr:nth-child(2) th{top:var(--h1,33px)}
.bg thead tr:first-child th:first-child,.bg tbody td:first-child{position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--line);min-width:250px}
.bg thead tr:first-child th:first-child{background:var(--head);z-index:4}
.bg tr.h td{font-weight:600;background:#fcfcfe}
.bg tr.h td:first-child{background:#fcfcfe}
.bg tr.t td{font-weight:600;border-top:1px solid #d9dbe6}
.bg tr.net td{font-weight:700;border-top:2px solid var(--text)}
.bg .gin{width:96px;height:28px;border:1px solid #e3e3ec;border-radius:4px;text-align:right;padding:0 6px;background:#fff;font-variant-numeric:tabular-nums}
.bg .gin:focus{outline:none;border-color:var(--blue)}
.bg td.r{min-width:96px}
.bg .grp{text-align:center;border-left:1px solid var(--line)}
.bg .gl{border-left:1px solid var(--line)}
.good{color:var(--green)}
.badv{color:var(--red)}
.fillb{color:#9a9eb2;cursor:pointer;margin-left:6px;vertical-align:middle;display:inline-grid}
.fillb:hover{color:var(--blue)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.lock-card{display:flex;align-items:center;gap:16px;border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:12px;max-width:1070px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.lock-card .lic{width:48px;height:48px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:#6c718a}
.lock-card .lic.on{color:var(--orange);border-color:#f8d9b0;background:#fff8ee}
.lock-card h4{margin:0 0 4px;font-size:17px;font-weight:600}
.lock-all{background:#fff4ea;padding:18px 24px;display:flex;align-items:center;margin-top:30px}
.tree{border:1px solid var(--line);border-radius:6px;max-height:380px;overflow:auto;padding:8px 10px}
.tree label{display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer}
.tree .tg{font-weight:600;margin-top:6px;color:#30344a}

<script type="module">
/* =========================================================================
   Books, Banking module.
   Money maths: every amount is an integer in paisa. Never floating point.
   Storage: Google Sheet through Apps Script (Settings), or this browser.
   ========================================================================= */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
let pdfjsLib = null;
async function pdfjs() {
  if (pdfjsLib) return pdfjsLib;

  try { // same-origin blob worker, so parsing runs off the main thread
    const code = await (await fetch(PDFJS + 'pdf.worker.min.mjs')).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  } catch { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs'; }
  return pdfjsLib;
}

/* ---------- helpers ---------- */
const P = v => Math.round(Number(v || 0) * 100);
const T = p => Math.round(p) / 100;
const money = p => (p < 0 ? '-' : '') + 'BDT' + (Math.abs(p) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = p => p ? (Math.abs(p) / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }; // local date (Bangladesh), not UTC
const MON = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };
const isoDate = d => { const [dd, mm, yy] = d.split('-'); return `${yy}-${MON[mm.toLowerCase()]}-${dd}`; };
const dt = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- icons ---------- */
const I = { star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>', plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',

const ic = (n, s = 18, cls = 'i', w = 1.6) => `<svg class="${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ---------- EBL statement parser (verified against balance + footer) ---------- */
function parseEBL(pages) {
  const DATE = /^\d{2}-[A-Za-z]{3}-\d{4}$/, AMT = /^-?[\d,]+\.\d{2}$/;
  const toP = s => Math.round(parseFloat(String(s).replace(/,/g, '')) * 100);
  let cols = null, meta = {}, txns = [], cur = null, opening = null, footer = {};
  for (const page of pages) {
    const its = page.items.filter(i => i.str.trim() && i.str.trim() !== 'e-statement');
    const hdr = its.find(i => i.str.trim() === 'DEBITS');
    const headerY = hdr ? hdr.y : 9999;
    if (hdr) {
      const r = n => { const i = its.find(t => t.str.trim() === n); return i.x + i.w; };
      cols = { dr: r('DEBITS'), cr: r('CREDITS'), bal: r('BALANCE'), desc: (its.find(t => t.str.trim() === 'DESCRIPTION')?.x ?? 80) - 5 };
    }
    if (!cols) continue;
    for (const i of its) { const s = i.str.trim(); if (s.startsWith(': ')) { const lab = its.find(t => Math.abs(t.y - i.y) < 2 && t.x < i.x && t.x > 300); if (lab) meta[lab.str.trim()] = s.slice(2).trim(); } }
    const ft = its.map(i => i.str).join(' ');
    let m = ft.match(/DEBITS\s+([\d.,]+)\s+#DRCOUNT:\s*(\d+)/); if (m) { footer.debits = toP(m[1]); footer.drCount = +m[2]; }
    m = ft.match(/CREDITS\s+([\d.,]+)\s+#CRCOUNT:\s*(\d+)/); if (m) { footer.credits = toP(m[1]); footer.crCount = +m[2]; }
    const body = its.filter(i => i.y < headerY - 5 && i.y > 40).sort((a, b) => b.y - a.y || a.x - b.x);
    for (const i of body) {
      const s = i.str.trim();
      if (/STATEMENT CLOSING BALANCE|OPENING BALANCE$|^DEBITS$|^CREDITS$|UNCOLLECTED|UNSETTLED|UNAUTH ENTRY/.test(s)) { cur = null; continue; }
      if (i.x < cols.desc && DATE.test(s)) { cur = { date: s, desc: [], amts: [] }; txns.push(cur); continue; }
      if (!cur) continue;
      if (AMT.test(s) && i.x > cols.desc + 200) {
        const right = i.x + i.w;
        const c = ['dr', 'cr', 'bal'].reduce((a, b) => Math.abs(cols[a] - right) < Math.abs(cols[b] - right) ? a : b);
        cur.amts.push({ c, v: toP(s) });
      } else cur.desc.push(s);
    }
  }
  if (!cols) throw new Error('This does not look like an EBL statement.');
  const rows = [], errors = []; let prev = null;
  for (const t of txns) {
    const g = c => (t.amts.find(a => a.c === c) || {}).v;
    const desc = t.desc.join(' ').replace(/\s+/g, ' ').trim();
    if (/^Opening Balance/i.test(desc)) { opening = g('bal'); prev = opening; continue; }
    const debit = g('dr') || 0, credit = g('cr') || 0, balance = g('bal');
    const ref = ((desc.match(/\/\/\s*([A-Za-z0-9]+)/g) || []).pop() || '').replace(/\/\/\s*/, '');
    if (balance === undefined) errors.push(`${t.date}: balance missing`);
    else if (prev !== null && prev - debit + credit !== balance) errors.push(`${t.date} ${desc.slice(0, 40)}: expected ${num(prev - debit + credit)}, statement ${num(balance)}`);
    if (balance !== undefined) prev = balance;
    rows.push({ date: isoDate(t.date), description: desc, reference: ref, debit, credit, balance: balance ?? null });
  }
  const sum = k => rows.reduce((a, r) => a + r[k], 0);
  const c = { opening, closing: prev, debits: sum('debit'), credits: sum('credit'), drCount: rows.filter(r => r.debit).length, crCount: rows.filter(r => r.credit).length, footer, errors };
  c.hasFooter = footer.debits !== undefined;
  c.ok = errors.length === 0 && opening !== null && opening - c.debits + c.credits === prev &&
    (!c.hasFooter || (footer.debits === c.debits && footer.credits === c.credits && footer.drCount === c.drCount && footer.crCount === c.crCount));
  return { meta, rows, check: c };
}
async function readPdf(file, password) {
  const lib = await pdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), password: password || undefined }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    pages.push({ items: tc.items.map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5], w: i.width })) });
  }
  return pages;
}
function labelFor(d) {
  const ph = (d.match(/01\d{9}/) || [])[0] || '';
  if (/MFS Transfer-bKash/i.test(d)) return 'bKash Transfer to ' + ph;
  if (/MFS Transfer-Nagad/i.test(d)) return 'Nagad Transfer to ' + ph;
  if (/MFS Transfer-Rocket/i.test(d)) return 'Rocket Transfer to ' + ph;
  if (/Mobile Recharge/i.test(d)) return 'Mobile Recharge ' + ph;
  if (/AC TRANSFER THROUGH EBL CONNECT/i.test(d)) return 'EBL Connect Merchant Payment';
  if (/Credit Card to EBL AC/i.test(d)) return 'Credit Card to Account Transfer';
  if (/^EBL Account Transfer/i.test(d)) return 'EBL Account Transfer';
  if (/NPSB FUND TRANSFER/i.test(d)) { const b = d.match(/\|\|\d+\|([A-Za-z .]+?)\s+(Dhaka|DHAKA|BD)/); return 'NPSB Fund Transfer' + (b && !/DC TO NPSB/i.test(b[1]) ? ' (' + b[1].trim() + ')' : ''); }
  if (/CASH DEPOSIT/i.test(d)) { const n = d.match(/CASH DEPOSIT\s+(.+?)\s*-/i); return 'Cash Deposit' + (n ? ' by ' + n[1] : ''); }
  if (/Interest on Retail Loan/i.test(d)) return 'Interest on Retail Loan';
  if (/Retail Principal/i.test(d)) return 'Retail Loan Principal';
  return d.replace(/\/\/\S+/g, '').slice(0, 60).trim();
}

/* ---------- data ---------- */
const BUSINESSES = ['Sharanga', 'Mynflow'];
const OLD_BIZ = 'Sharangakutir';
/* Zoho Books account types, grouped. Assets and Expenses are debit-normal. */
const ACC_GROUPS = [
  ['Asset', ['Other Asset', 'Other Current Asset', 'Cash', 'Bank', 'Fixed Asset', 'Stock', 'Accounts Receivable']],

  ['Expense', ['Expense', 'Cost Of Goods Sold', 'Other Expense']]

const TYPE_ORDER = ACC_GROUPS.flatMap(g => g[1]);
const PL_TYPES = ['Income', 'Other Income', 'Expense', 'Cost Of Goods Sold', 'Other Expense'];
const OLD_TYPE = { Transfer: 'Other Current Asset', Loan: 'Long Term Liability', Owner: 'Equity' };
const TYPE_HELP = {
  'Other Asset': 'Track special assets like goodwill and other intangible assets.',

  'Stock': 'Value of the stock you hold for sale.',
  'Accounts Receivable': 'Money customers or couriers owe you.',

  'Other Liability': 'Any other obligation.',
  'Accounts Payable': 'Money you owe vendors for bills.',
  'Equity': 'Owner money put into or taken out of the business. Never part of profit.',

  'Other Income': 'Income outside the main business, such as interest.',
  'Expense': 'Day to day costs of running the business.',
  'Cost Of Goods Sold': 'Direct cost of what you sell: raw materials, printing, packaging.',

};
// No business data is kept in this file: names, balances, salaries and budgets live only in the Google Sheet (Code.gs seeds them).
// Anyone can read a web page's code, so this file holds the program only. Tests inject the old browser seed through window.__BOOKS_SEED.
const SEED = (typeof window !== 'undefined' && window.__BOOKS_SEED) || {};
const OFFICE_COSTS = SEED.officeCosts || [];
const DEFAULT_CATS = [
  ['Steadfast Payout', 'Income'], ['Client Payment', 'Income'], ['Other Income', 'Income'], ['Office Rent', 'Expense'], ...OFFICE_COSTS.map(([n]) => [n, 'Expense']), ['Ads', 'Expense'], ['Courier Charge', 'Expense'], ['Packaging', 'Expense'], ['Raw Materials', 'Expense'], ['Software & Tools', 'Expense'], ['Mobile & Internet', 'Expense'], ['Transport', 'Expense'], ['Food & Entertainment', 'Expense'], ['Bank Charges', 'Expense'], ['Loan Interest', 'Expense'], ['Other Expense', 'Expense'],
  ['Own Account Transfer', 'Other Current Asset'], ['Loan Received', 'Long Term Liability'], ['Loan Repayment', 'Long Term Liability'], ['Owner Investment', 'Equity'], ['Owner Withdrawal', 'Equity'], ...(SEED.cats || []), ['Salaries Payable', 'Other Current Liability', 1],
  ['Salary', 'Expense'],
  ['Prepaid Expenses', 'Other Current Asset'], ['Employee Advance', 'Other Current Asset'], ['Furniture and Equipment', 'Fixed Asset'],
  ['Accounts Receivable', 'Accounts Receivable', 1], ['Inventory Asset', 'Stock', 1], ['Accounts Payable', 'Accounts Payable', 1], ['Opening Balance Adjustments', 'Other Current Liability', 1], ['Cost of Goods Sold', 'Cost Of Goods Sold', 1],
  ['Sales', 'Income', 1], ['COD Charge', 'Expense'], ['Opening Balance Offset', 'Equity', 1]
];
const normCat = c => ({ name: String(c.name), type: OLD_TYPE[c.type] || c.type || 'Expense', code: String(c.code ?? ''), description: String(c.description ?? ''), parent: String(c.parent ?? ''), active: !(c.active === false || String(c.active).toUpperCase() === 'FALSE'), system: c.system === true || c.system === 1 || String(c.system).toUpperCase() === 'TRUE', opening_balance: Number(c.opening_balance || 0) });

  businesses: [...BUSINESSES],

  accounts: [['EBL Current', 'Bank'], ['EBL Savings', 'Bank'], ['Mynflow', 'Bank'], ['bKash', 'Mobile Banking'], ['Nagad', 'Mobile Banking'], ['Petty Cash', 'Cash'], ['Undeposited Funds', 'Cash']].map(([name, type]) => newAcc(name, type)),

function newAcc(name, type) { return { id: uid(), name, type, bank: type === 'Bank' && name.startsWith('EBL') ? 'Eastern Bank PLC' : '', account_no: '', opening_balance: 0, active: true }; }

  d.rules.forEach(r => { if (r.category === from) r.category = to; });
  d.journals.forEach(j => j.lines.forEach(l => { if (l.account === from) l.account = to; }));
  d.budgets.forEach(b => { if (b.values && from in b.values) { b.values[to] = b.values[from]; delete b.values[from]; } b.accounts = b.accounts.map(a => a === from ? to : a); });

function catUsage(d, name) {

}

/* pair "transfer to another account" lines with the opposite line in that account (same amount, within 5 days) */
async function pairTransfers() {
  const tx = S.transactions, taken = new Set(); let n = 0;
  for (const a of tx) {
    if (!isTransfer(a) || a.transfer_pair || taken.has(a.id) || isLocked('banking', a.date)) continue;
    const other = a.category.slice(1);
    const b = tx.find(x => x.account_id === other && !x.transfer_pair && !taken.has(x.id) && x.id !== a.id && (!x.category || x.category === '@' + a.account_id) &&
      (a.debit ? x.credit === a.debit && !x.debit : x.debit === a.credit && !x.credit) && Math.abs(new Date(x.date) - new Date(a.date)) <= 5 * 864e5 && !isLocked('banking', x.date));
    if (!b) continue;
    taken.add(a.id); taken.add(b.id);
    await saveTxn([a.id], { transfer_pair: b.id });
    await saveTxn([b.id], { category: '@' + a.account_id, transfer_pair: a.id, business: '' });
    n++;
  }
  return n;
}
/* HIS RULE (3 Nov 2026): money moving between his own accounts is a transfer, found by itself on uncategorized statement lines.
   1. EBL to EBL: the line going out and the line coming in carry the SAME reference and the same amount (both statements imported).
   2. bKash / Nagad / another bank: the description names that account's number (Banking > Edit account, Account Number).
   3. Credit card: the description shows the masked card ending in that account's last 4 digits (e.g. 423858******2090). */
const digitsOf = s => String(s || '').replace(/\D/g, '');
function ownAccountIn(t) {
  const d = t.description || '';
  for (const a of S.accounts) {
    if (a.id === t.account_id || a.active === false) continue;
    const n = digitsOf(a.account_no);
    if (n.length >= 10 && new RegExp('(^|\\D)' + n + '(\\D|$)').test(d)) return a;
    if (n.length === 4 && new RegExp('\\*{2,}' + n + '(\\D|$)').test(d)) return a;
  }
  return null;
}
async function autoTransfers() {
  const tx = S.transactions, free = t => !t.category && !t.transfer_pair && (t.source === 'statement' || t.source === 'email') && !isLocked('banking', t.date);
  let n = 0;
  for (const a of tx) {
    if (!free(a) || !a.debit || a.credit) continue; const k = refKey(a.reference); if (k.length < 6) continue;
    const c = tx.filter(b => b.account_id !== a.account_id && free(b) && b.credit === a.debit && !b.debit && refKey(b.reference) === k);
    if (c.length !== 1) continue; const b = c[0];
    await saveTxn([a.id], { category: '@' + b.account_id, transfer_pair: b.id, business: '', party: '' });
    await saveTxn([b.id], { category: '@' + a.account_id, transfer_pair: a.id, business: '', party: '' }); n++;
  }
  for (const t of tx) { if (!free(t)) continue; const acc = ownAccountIn(t); if (!acc) continue; await saveTxn([t.id], { category: '@' + acc.id, business: '' }); n++; }
  if (n) await pairTransfers();
  return n;
}
async function unpair(list) {
  for (const t of list) {
    if (!t.transfer_pair) continue;
    const o = S.transactions.find(x => x.id === t.transfer_pair);
    await saveTxn([t.id], { transfer_pair: '' });
    if (o) await saveTxn([o.id], { category: '', transfer_pair: '', business: '' });
  }
}

async function saveTxn(ids, changes) {

function ruleKeyword(t) {
  const d = t.description || '';
  if (t.source === 'manual') return '';
  return (d.match(/01\d{9}/) || [])[0] || (d.match(/CASH DEPOSIT\s+(.+?)\s*-/i) || [])[1] || (/EBL CONNECT/i.test(d) ? 'EBL CONNECT' : '') || (/^EBL Account Transfer/i.test(d) ? '' : (t.label || '').slice(0, 30));
}
async function createRule(r) {
  const saved = await api('saveRule', r); S.rules.unshift({ ...r, id: saved.id });
  const hits = S.transactions.filter(t => !isDone(t) && !isLocked('banking', t.date) && (!r.account || t.account_id === r.account) && t.description.toLowerCase().includes(r.keyword.toLowerCase()) && (r.direction === 'Any' || (t.credit ? 'In' : 'Out') === r.direction));
  if (hits.length) await saveTxn(hits.map(h => h.id), { category: r.category, business: r.business || '', ...(r.party ? { party: r.party } : {}) });
  return hits.length;
}

/* ---------- Import from screenshots (bKash, Nagad, bank and card app history) ----------
   Gemini (Code.gs readShots) reads each picture; everything below is checked here: rows before the books start are skipped,
   rows seen in two pictures count once, rows already in the account are not added again, and he ticks what goes in. */
const SHOT_START = '2026-11-01'; // the books start on 1 Nov 2026: earlier transactions never enter
const SHOT_MAX = 30; // pictures per import
const shotTxt = v => String(v == null ? '' : v).replace(/[০-৯]/g, c => String(c.charCodeAt(0) - 0x09E6)).replace(/[ঀ-৿]+/g, ' ').replace(/\s+/g, ' ').trim(); // English only in the books
const shotDigits = v => shotTxt(v).replace(/[^0-9Xx*]/g, '').toUpperCase();
function shotDate(v) {
  let d = shotTxt(v); const m = d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (!m) return '';
  let y = +m[1]; const mo = +m[2], da = +m[3], t = today();
  if (!y) { y = +t.slice(0, 4); if (`${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}` > t) y--; } // no year in the picture: the latest past date
  const x = new Date(Date.UTC(y, mo - 1, da)); if (x.getUTCMonth() !== mo - 1 || x.getUTCDate() !== da) return '';
  return `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
}
function shotRows(results, acc) {
  const out = [], seen = new Map(), errors = [];
  const accTx = S.transactions.filter(t => t.account_id === acc.id), have = new Set(accTx.map(t => t.dedupe_key));
  const hintAcc = h => { const d = String(h || '').replace(/\D/g, ''); if (d.length < 4) return null; return S.accounts.find(a => a.active && String(a.account_no || '').replace(/\D/g, '').endsWith(d.slice(-4))) || null; };
  results.forEach(r => {
    if (r.error) { errors.push(`${r.name}: ${r.error}`); return; }
    if (!(r.rows || []).length) { errors.push(`${r.name}: no transactions found in this picture`); return; }
    const owner = hintAcc(r.account_hint);
    r.rows.forEach(x => {
      const date = shotDate(x.date), tm = shotTxt(x.time).match(/^\d{1,2}:\d{2}/), time = tm ? tm[0].padStart(5, '0') : '', dir = String(x.direction).toLowerCase() === 'in' ? 'in' : 'out';
      const type = shotTxt(x.type) || (dir === 'in' ? 'Deposit' : 'Withdrawal'), details = shotTxt(x.details), party = shotTxt(x.counterparty), txn = shotTxt(x.txn_id).replace(/^#/, '');
      const amt = Math.abs(P(x.amount)), fee = Math.abs(P(x.fee));
      const push = (typ, a, d, fee2) => {
        const desc = [typ, details && details.toLowerCase() !== typ.toLowerCase() && !fee2 ? details : '', party, txn ? 'TrxID ' + txn : ''].filter(Boolean).join(' | ');
        const key = ['img', date, time, d, a, fee2 ? 'fee' : '', txn || shotDigits(party)].join('|');
        const row = { img: r.name, date, time, label: typ + (party && !fee2 ? ' ' + party : ''), description: desc, reference: txn, debit: d === 'out' ? a : 0, credit: d === 'in' ? a : 0, balance: null, business: '', category: '', party: '', note: '', dedupe_key: key, skip: '', maybe: '' };
        if (!date) row.skip = 'Date not readable';
        else if (!a) row.skip = 'Amount not readable';
        else if (x.partial) row.skip = 'Cut off in the picture';
        else if (date < SHOT_START) row.skip = 'Before 1 Nov 2026';
        else if (owner && owner.id !== acc.id) row.skip = 'Belongs to ' + owner.name;
        else if (have.has(key)) row.skip = 'Already imported';
        else if (seen.has(key)) row.skip = 'Also in ' + seen.get(key);
        else if (accTx.some(t => t.date === date && t.debit === row.debit && t.credit === row.credit)) row.maybe = 'Same date and amount already in this account';
        if (!row.skip) seen.set(key, r.name);
        out.push(row);
      };
      push(type, amt, dir, false);
      if (fee > 0) push(/fee$/i.test(type) ? type : type + ' Fee', fee, 'out', true); // bKash shows the fee under the row: it becomes its own withdrawal
    });
  });
  out.sort((a, b) => (!!a.skip - !!b.skip) || (a.date || '9').localeCompare(b.date || '9') || a.time.localeCompare(b.time)); // what will be imported on top, skipped rows below
  out.forEach((r, i) => { r.seq = i; r.inc = !r.skip && !r.maybe; if (!r.skip) Object.assign(r, applyRules(r, acc.id)); });
  return { rows: out, errors };
}

/* Search in every dropdown: a select with many options opens a list with a search box (type to filter, arrows, Enter).
   The real select keeps its value and gets the usual change event, so every form works as before. */
const SPICK_MIN = 8;
function closePick() { const p = $('.spick'); if (p) { p.remove(); document.removeEventListener('mousedown', SPICK_OUT, true); } }

function openPick(sel) {

  const draw = () => {
    const q = inp.value.trim().toLowerCase(); shown = []; let html = '', lastG = null;
    items.forEach(it => { if (it.g !== undefined) return; const t = it.o.textContent; if (q && !(t.toLowerCase().includes(q) || (it.gl || '').toLowerCase().includes(q))) return;

      const i = shown.length; shown.push(it.o); html += `<div class="so ${it.o.disabled ? 'dis' : ''} ${it.o.selected ? 'cur' : ''}" data-si="${i}" title="${esc(t)}">${esc(t) || '&nbsp;'}</div>`; });

  const mark = () => { list.querySelectorAll('.so').forEach(el => el.classList.toggle('hl', +el.dataset.si === hl)); const el = list.querySelector(`[data-si="${hl}"]`); if (el) el.scrollIntoView({ block: 'nearest' }); };
  const pick = i => { const o = shown[i]; if (!o || o.disabled) return; closePick(); if (sel.value !== o.value || !o.selected) { sel.value = o.value; o.selected = true; sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true })); } sel.focus(); };
  hl = Math.max(0, items.filter(x => x.o).findIndex(x => x.o.selected)); draw();

  list.onmousemove = e => { const el = e.target.closest('[data-si]'); if (el && +el.dataset.si !== hl) { hl = +el.dataset.si; mark(); } };

}
const pickable = el => el && el.tagName === 'SELECT' && !el.multiple && !el.disabled && el.options.length >= SPICK_MIN;
document.addEventListener('mousedown', e => { const sel = e.target.closest && e.target.closest('select'); if (!pickable(sel) || e.button !== 0) return; e.preventDefault(); sel.focus(); if ($('.spick')) closePick(); else openPick(sel); }, true);

let CF = { view: 'active', q: '' };
const CHART_VIEWS = [['all', 'All Accounts'], ['active', 'Active Accounts'], ['inactive', 'Inactive Accounts'], ['Asset', 'Asset Accounts'], ['Liability', 'Liability Accounts'], ['Equity', 'Equity Accounts'], ['Income', 'Income Accounts'], ['Expense', 'Expense Accounts']];
function chartRows() {
  const all = [...S.categories.map(c => ({ ...c, key: c.name })), ...S.accounts.map(a => ({ key: '@' + a.id, name: a.name, type: a.type === 'Cash' ? 'Cash' : 'Bank', code: '', parent: '', description: '', active: a.active, system: false, bank: a }))];
  const out = [], seen = new Set(), byName = (a, b) => a.name.localeCompare(b.name);
  TYPE_ORDER.forEach(t => {
    const l = all.filter(r => r.type === t);
    const add = (r, lv) => { if (seen.has(r.key)) return; seen.add(r.key); out.push({ ...r, lv }); l.filter(x => x.parent === r.name && !x.bank).sort(byName).forEach(x => add(x, lv + 1)); };
    l.filter(r => !r.parent || !l.some(x => x.name === r.parent)).sort(byName).forEach(r => add(r, 0));
    l.forEach(r => add(r, 0)); // anything left (broken parent chain) shows at top level
  });
  return out;
}
function viewChart() {
  const v = CF.view, q = CF.q.toLowerCase();
  const rows = chartRows().filter(r => (v === 'all' || (v === 'active' ? r.active : v === 'inactive' ? !r.active : (TYPE_GROUP[r.type] === v && r.active))) && (!q || [r.name, r.code, r.type, r.parent].join(' ').toLowerCase().includes(q)));
  $('#page').innerHTML = `<div class="ph"><h1><select class="hsel" id="cv">${CHART_VIEWS.map(([k, n]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${n}</option>`).join('')}</select></h1>
    <input class="in" id="cq" placeholder="Search in Chart of Accounts" style="width:240px" value="${esc(CF.q)}"><button class="btn p" id="nc">+ New</button></div>
  <table><thead><tr><th style="width:44px"></th><th>Account Name</th><th>Account Code</th><th>Account Type</th><th>Parent Account Name</th><th style="width:50px"></th></tr></thead>
  <tbody>${rows.map(r => `<tr><td><span class="lk" title="${r.system ? 'System account' : ''}">${r.system ? ic('lock', 15) : ''}</span></td>
    <td style="padding-left:${14 + r.lv * 22}px"><a data-go="${r.bank ? 'account' : 'coa'}" data-arg="${esc(r.bank ? r.bank.id : r.name)}">${esc(r.name)}</a>${r.active ? '' : ' <span class="tag">Inactive</span>'}</td>
    <td>${esc(r.code)}</td><td>${esc(r.type)}</td><td>${esc(r.parent)}</td>
    <td><div class="rowmenu"><span class="gear" data-cm="${esc(r.key)}">${ic('gear', 16)}</span></div></td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">No accounts found.</div></td></tr>'}</tbody></table>
  <div class="pc mut sm">Income and Expense accounts (including Other Income, Cost Of Goods Sold and Other Expense) make up profit. Asset, Liability and Equity accounts, such as own account transfers, loans and owner money, are never counted as profit or loss.</div>`;
  $('#cv').onchange = e => { CF.view = e.target.value; viewChart(); };
  $('#cq').oninput = e => { CF.q = e.target.value; viewChart(); const el = $('#cq'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  $('#nc').onclick = () => chartForm();
  $$('[data-cm]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const key = b.dataset.cm, bank = bankOf(key), c = S.categories.find(x => x.name === key);
    const active = bank ? bank.active : c.active;
    const items = [['edit', 'Edit']];
    if (!(c && c.system)) items.push(['toggle', active ? 'Mark as Inactive' : 'Mark as Active']);
    if (c && !c.system) items.push(['del', 'Delete']);
    rowMenu(b, items, async k => {
      try {
        if (k === 'edit') return bank ? accountForm(bank) : chartForm(c);
        if (k === 'toggle') {
          if (bank) { bank.active = !bank.active; await saveAcc(bank); }
          else { await api('saveCategory', { ...c, active: !c.active, old_name: c.name }); c.active = !c.active; }
          note(active ? 'Account marked as inactive' : 'Account marked as active'); viewChart();
        }
        if (k === 'del') { if (!confirm(`Delete the account "${c.name}"?`)) return; await api('deleteCategory', { name: c.name }); S.categories = S.categories.filter(x => x !== c); note('Account deleted'); viewChart(); }
      } catch (err) { note(err.message, 1); }
    });
  });
}
function descendants(name) { const out = new Set(), walk = n => S.categories.filter(c => c.parent === n).forEach(c => { if (!out.has(c.name)) { out.add(c.name); walk(c.name); } }); walk(name); return out; }
function chartForm(c) {
  const isNew = !c;
  c = c || { name: '', type: 'Expense', code: '', description: '', parent: '', active: true, system: false };
  const types = ACC_GROUPS.map(([g, ts]) => `<optgroup label="${g}">${ts.filter(t => isNew || (t !== 'Bank' && t !== 'Cash')).map(t => `<option ${t === c.type ? 'selected' : ''}>${t}</option>`).join('')}</optgroup>`).join('');
  const m = modal(isNew ? 'Create Account' : 'Edit Account', `<div style="display:grid;grid-template-columns:1fr 250px;gap:22px;align-items:start">
    <div>
      <div class="frow"><label class="req">Account Type*</label><select class="in" id="a1" ${c.system ? 'disabled' : ''}>${types}</select></div>
      <div class="frow"><label class="req">Account Name*</label><input class="in" id="a2" value="${esc(c.name)}" ${c.system ? 'disabled' : ''}></div>
      <div id="bankf" style="display:none">
        <div class="frow"><label>Bank Name</label><input class="in" id="a7"></div>
        <div class="frow"><label>Account Number</label><input class="in" id="a8"></div></div>
      <div id="catf">
        <div class="frow"><label></label><label class="chk"><input type="checkbox" id="a3" ${c.parent ? 'checked' : ''} ${c.system ? 'disabled' : ''}> Make this a sub-account</label></div>
        <div class="frow" id="prow"><label class="req">Parent Account*</label><select class="in" id="a4"></select></div>
        <div class="frow"><label>Account Code</label><input class="in" id="a5" value="${esc(c.code)}" style="max-width:180px"></div>
        <div class="frow" id="obrow"><label>Opening Balance</label><input class="in" id="a9" value="${c.opening_balance ? T(c.opening_balance) : ''}" inputmode="decimal" style="max-width:180px" placeholder="On ${dt(OPENING_AS_OF)}"></div>
        <div class="frow" style="align-items:start"><label>Description</label><textarea class="in" id="a6" rows="3" maxlength="500" style="height:auto;padding:8px 10px" placeholder="Max. 500 characters">${esc(c.description)}</textarea></div></div>
    </div><div class="tip" id="atip"></div></div>`,
    `<button class="btn p" id="as">Save</button><button class="btn" data-x>Cancel</button>`, 1);
  $$('[data-x]', m).forEach(b => b.onclick = () => m.remove());
  const desc = isNew ? new Set() : descendants(c.name);
  const sync = () => {
    const t = $('#a1', m).value, bank = t === 'Bank' || t === 'Cash';
    $('#atip', m).innerHTML = `<b>${esc(TYPE_GROUP[t])}: ${esc(t)}</b>${esc(TYPE_HELP[t] || '')}${PL_TYPES.includes(t) ? '<br><br>Counts in Profit and Loss. Each transaction needs a business.' : '<br><br>Does not count in Profit and Loss.'}`;
    $('#bankf', m).style.display = bank ? '' : 'none'; $('#catf', m).style.display = bank ? 'none' : '';
    const opts = S.categories.filter(x => x.type === t && x.name !== c.name && !desc.has(x.name));
    $('#a4', m).innerHTML = `<option value="">Select an account</option>` + opts.map(x => `<option ${x.name === c.parent ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    $('#prow', m).style.display = $('#a3', m).checked ? '' : 'none';
    $('#obrow', m).style.display = PL_TYPES.includes(t) ? 'none' : '';
  };
  $('#a1', m).onchange = sync; $('#a3', m).onchange = sync; sync();
  $('#as', m).onclick = async () => {
    const t = $('#a1', m).value, name = $('#a2', m).value.trim();
    if (!name) return note('Account name is required', 1);
    try {
      if (t === 'Bank' || t === 'Cash') {
        const rec = { name, type: t, bank: $('#a7', m).value.trim(), account_no: $('#a8', m).value.trim(), opening_balance: 0, active: true };
        rec.id = await saveAcc(rec); S.accounts.push(rec); m.remove(); note('Account created'); return viewChart();
      }
      const sub = $('#a3', m).checked, parent = sub ? $('#a4', m).value : '';
      if (sub && !parent) return note('Select the parent account', 1);
      if (!isNew && t !== c.type && desc.size) return note('This account has sub-accounts. Move them first, then change its type.', 1);
      const ob = PL_TYPES.includes(t) ? 0 : parseAmt($('#a9', m).value); if (Number.isNaN(ob)) return note('Enter a valid opening balance', 1);
      const rec = { name, type: t, code: $('#a5', m).value.trim(), description: $('#a6', m).value.trim(), parent, active: c.active, system: c.system, old_name: isNew ? '' : c.name, opening_balance: ob };
      await api('saveCategory', live() ? { ...rec, opening_balance: T(ob) } : rec);
      await load(); m.remove(); note(isNew ? 'Account created' : 'Account saved');
      if (R.name === 'coa') go('coa', name); else viewChart();
    } catch (e) { note(e.message, 1); }
  };
}

}</div>` : `<div class="t"><a data-go="journal" data-arg="${e.j.id}">Manual Journal ${esc(e.j.journal_no)}</a></div><div class="s">${esc(e.l.description || e.j.notes)}</div>`}</td>

/* ---------- Manual Journals ---------- */
let JF = { status: 'all' };
const jTotal = j => j.lines.reduce((s, l) => s + l.debit, 0);
function nextJournalNo() { const n = S.journals.reduce((mx, j) => Math.max(mx, Number((String(j.journal_no).match(/(\d+)\s*$/) || [])[1] || 0)), 0) + 1; return 'JV-' + String(n).padStart(4, '0'); }
function viewJournals() {
  const list = S.journals.filter(j => JF.status === 'all' || j.status === JF.status).sort((a, b) => b.date.localeCompare(a.date) || String(b.journal_no).localeCompare(String(a.journal_no)));
  $('#page').innerHTML = `<div class="ph"><h1><select class="hsel" id="jst">${[['all', 'All Manual Journals'], ['Draft', 'Draft'], ['Published', 'Published']].map(([k, n]) => `<option value="${k}" ${JF.status === k ? 'selected' : ''}>${n}</option>`).join('')}</select></h1><button class="btn p" data-go="jform">+ New</button></div>
  ${!S.journals.length ? `<div class="empty" style="padding-top:110px"><h3 style="font-size:20px">Start making journal entries.</h3><div>You can transfer and adjust money between accounts.</div><br><button class="btn p" data-go="jform" style="height:40px;padding:0 22px">CREATE NEW JOURNAL</button></div>` :
  `<table><thead><tr><th>Date</th><th>Journal#</th><th>Reference Number</th><th>Status</th><th>Notes</th><th class="r">Amount</th></tr></thead><tbody>
  ${list.map(j => `<tr class="click" data-j="${j.id}"><td>${dt(j.date)}</td><td><a>${esc(j.journal_no)}</a></td><td>${esc(j.reference)}</td><td style="color:${j.status === 'Published' ? 'var(--green)' : 'var(--muted)'};font-weight:500">${j.status.toUpperCase()}</td><td class="det"><div class="s" style="color:var(--text)">${esc(j.notes)}</div></td><td class="r">${money(jTotal(j))}</td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">No journals in this view.</div></td></tr>'}</tbody></table>`}`;
  $('#jst').onchange = e => { JF.status = e.target.value; viewJournals(); };
  $$('tr[data-j]').forEach(tr => tr.onclick = () => go('journal', tr.dataset.j));

function viewJournal() {
  const j = S.journals.find(x => x.id === R.arg);

  $('#page').innerHTML = `<div class="ph"><h1>${esc(j.journal_no)}</h1>
    ${j.status === 'Draft' ? '<button class="btn p" id="jpub">Publish</button>' : ''}<button class="btn" data-go="jform" data-arg="${j.id}">${ic('edit', 14)} Edit</button>

        <div style="text-align:right"><span class="tag" style="background:${j.status === 'Published' ? '#e3f6ec' : '#eef0f6'};color:${j.status === 'Published' ? 'var(--green)' : '#41465d'}">${j.status}</span>

  }); };
}

/* =========================================================================
   Sales (Sharanga): Steadfast payment statements.
   Each payout = one Steadfast payment statement (SFC-...) with its parcels.
   Accounting per parcel, on its delivery date, business Sharanga:
     Cr Sales (cash collected), Dr Courier Charge (shipping), Dr COD Charge,
     Dr Accounts Receivable (what Steadfast owes for it).
   Payout level: COD charge is rounded to whole taka (rounding), and when the
   bank line is matched any remaining difference (bank_diff) is booked to COD
   Charge, so the receivable clears to exactly zero.
   ========================================================================= */
const XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const SALES_BIZ = 'Sharanga';
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return loadXlsx.p = loadXlsx.p || new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = XLSX_URL; sc.onload = () => ok(window.XLSX); sc.onerror = () => { loadXlsx.p = null; bad(new Error('Could not load the Excel reader. Check the internet connection.')); }; document.head.appendChild(sc); });
}
const PAYOUT_MONEY = ['collected', 'shipping', 'cod_charge', 'rounding', 'bank_diff', 'receive'];
const PARCEL_MONEY = ['cod', 'collected', 'shipping', 'cod_charge'];
function normPayout(o, L) {
  const m = v => L ? P(v) : Number(v || 0);
  const out = { ...o, parcels: (o.parcels || []).map(c => { const x = { ...c, consignment_id: String(c.consignment_id), invoice: String(c.invoice ?? '') }; PARCEL_MONEY.forEach(k => x[k] = m(c[k])); return x; }) };
  PAYOUT_MONEY.forEach(k => out[k] = m(o[k]));
  return out;
}
const payoutOut = o => { if (!live()) return o; const x = { ...o, parcels: o.parcels.map(c => { const y = { ...c }; PARCEL_MONEY.forEach(k => y[k] = T(c[k])); return y; }) }; PAYOUT_MONEY.forEach(k => x[k] = T(o[k])); return x; };
const receiveOf = o => o.collected - o.shipping - o.cod_charge - o.rounding - o.bank_diff;
const lastDelivery = o => o.parcels.reduce((m, c) => (c.delivered_at || c.created_at) > m ? (c.delivered_at || c.created_at) : m, '');
const isCollected = st => /deliver/i.test(st || '') && !/cancel|return/i.test(st || '');
const advanceFlag = c => isCollected(c.delivery_status) && c.cod > 0 && c.cod <= 100; // COD of 1 taka (100 paisa): paid in advance or a replacement
function payoutEntries(o) {
  const out = [], b = SALES_BIZ, add = (date, key, dr, cr, c) => { if (dr || cr) out.push({ date, key, dr, cr, business: b, src: 'sales', o, c }); };
  for (const c of o.parcels) {
    const d = c.delivered_at || c.created_at;
    add(d, 'Sales', 0, c.collected, c);
    add(d, 'Courier Charge', c.shipping, 0, c);
    add(d, 'COD Charge', c.cod_charge, 0, c);
    const ar = c.collected - c.shipping - c.cod_charge;
    add(d, 'Accounts Receivable', ar > 0 ? ar : 0, ar < 0 ? -ar : 0, c);
  }
  const adj = o.rounding + o.bank_diff, d = o.paid_date || lastDelivery(o);
  if (adj) { add(d, 'COD Charge', adj > 0 ? adj : 0, adj < 0 ? -adj : 0); add(d, 'Accounts Receivable', adj < 0 ? -adj : 0, adj > 0 ? adj : 0); }
  return out;
}

/* ---------- Excel parser for the Steadfast payment statement ---------- */
const SF_COLS = { created: 'Created At', consignment: 'Order ID', tracking: 'Tracking Code', invoice: 'Invoice', name: 'Recipient Name', phone: 'Recipient Phone', address: 'Recipient Address', status: 'Delivery Status', approval: 'Approval Status', delivered: 'Delivery Time', cod: 'COD Amount', shipping: 'Shipping Charge', codCharge: 'COD Charge', payment: 'Payment Status', note: 'Note' };
function parseSteadfast(rows, fileName) {
  const head = (rows[0] || []).map(h => String(h ?? '').trim());
  const idx = {}, missing = [];
  Object.entries(SF_COLS).forEach(([k, n]) => { idx[k] = head.indexOf(n); if (idx[k] < 0 && !['note', 'approval', 'tracking'].includes(k)) missing.push(n); });
  if (missing.length) throw new Error('This is not a Steadfast payment statement. Missing columns: ' + missing.join(', '));
  const errors = [], parcels = [];
  const money = (v, r, n) => { if (v === null || v === undefined || v === '') return 0; const x = Number(String(v).replace(/,/g, '')); if (!Number.isFinite(x) || x < 0) { errors.push(`Row ${r}: ${n} "${v}" is not a valid amount`); return 0; } return P(x); };
  const day = v => { const m = String(v ?? '').match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : ''; };
  rows.slice(1).forEach((r, i) => {
    if (!r || r.every(v => v === null || v === undefined || v === '')) return;
    const n = i + 2, g = k => idx[k] >= 0 ? r[idx[k]] : '';
    const status = String(g('status') || '').trim(), cod = money(g('cod'), n, 'COD Amount');
    const c = { consignment_id: String(g('consignment') ?? '').trim(), invoice: String(g('invoice') ?? '').trim(), tracking_code: String(g('tracking') ?? '').trim(),
      created_at: day(g('created')), delivered_at: day(g('delivered')), name: String(g('name') ?? '').trim(), phone: String(g('phone') ?? '').trim(), address: String(g('address') ?? '').replace(/\s+/g, ' ').trim(),
      delivery_status: status, approval_status: String(g('approval') || '').trim(), cod, collected: isCollected(status) ? cod : 0,
      shipping: money(g('shipping'), n, 'Shipping Charge'), cod_charge: money(g('codCharge'), n, 'COD Charge'), note: String(g('note') ?? '').replace(/^'?-$/, '').trim() };
    if (!c.consignment_id) errors.push(`Row ${n}: Order ID is empty`);
    if (!c.created_at) errors.push(`Row ${n}: Created At is not a date`);
    if (String(g('payment') || '').trim() !== 'Paid') errors.push(`Row ${n}: Payment Status is "${g('payment')}", expected Paid`);
    parcels.push(c);
  });
  if (!parcels.length) errors.push('The file has no parcels');
  const ids = parcels.map(c => c.consignment_id), dupIn = ids.filter((x, i) => ids.indexOf(x) !== i);
  if (dupIn.length) errors.push('Consignment repeated in the file: ' + [...new Set(dupIn)].join(', '));

  const cod_charge = sum('cod_charge'), rounded = Math.round(cod_charge / 100) * 100;

  return { statement_no: stmt ? 'SFC-' + stmt : '', file_name: fileName, parcels, collected: sum('collected'), shipping: sum('shipping'), cod_charge, rounding: rounded - cod_charge, bank_diff: 0, errors };
}
async function readSteadfast(file) {
  const X = await loadXlsx();
  const wb = X.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];

}
function bankCandidates(o) {
  const want = receiveOf(o), from = lastDelivery(o);
  return S.transactions.filter(t => t.credit > 0 && (!t.category || t.category === 'Steadfast Payout') && Math.abs(t.credit - want) <= 200 && t.date >= from && !S.payouts.some(x => x.bank_txn_id === t.id))
    .sort((a, b) => Math.abs(a.credit - want) - Math.abs(b.credit - want) || a.date.localeCompare(b.date));
}

    if (!confirm(`Delete the import of ${o.statement_no}? Its sales and charges will be removed.`)) return;
    try { await api('deletePayout', { id: o.id }); S.payouts = S.payouts.filter(x => x.id !== o.id); note('Payout deleted'); go('payouts'); } catch (err) { note(err.message, 1); }
  }); };
}

/* ---------- Import Steadfast payment (Zoho style steps) ---------- */
let SFI = null;
function viewSfImport() {
  SFI = { files: [], parsed: [] };
  $('#page').innerHTML = `<div class="ph"><h1 style="justify-content:center">Import Steadfast Payment</h1><span class="closex" data-go="payouts">${ic('x', 20, '', 2)}</span></div>
  <div class="steps"><div class="step on" id="s1"><b>1</b>Configure</div><div class="stepline"></div><div class="step" id="s2"><b>2</b>Preview</div></div><div id="ibody"></div>`;
  sfConfigure();
}
function sfConfigure() {
  $('#s1').className = 'step on'; $('#s2').className = 'step';
  $('#ibody').innerHTML = `<div class="imp">
    <div class="drop" id="dz"><div class="dlic">${ic('dl', 18, '', 2)}</div><div style="font-weight:600;margin-bottom:12px">Drag and drop files to import</div>
      <button class="btn p" id="cf">Choose Files</button><input type="file" id="fi" accept=".xlsx,.xls" multiple hidden>
      <div class="hint" style="margin-top:12px">Steadfast payment statement Excel (.xlsx). You can select several at once.</div><div id="fname" style="margin-top:8px;font-weight:500"></div></div>
    <div id="imsg"></div>
    <div class="tips"><b>Page Tips</b><ul>
      <li>In Steadfast open Payments, open a statement and download it. The file name has the statement number (SFC-...).</li>
      <li>Every amount is checked. You Receive = Cash Collected - Delivery Bill - COD Charge (rounded to whole taka).</li>
      <li>A statement or a parcel that is already imported is never imported twice.</li></ul></div></div>
  <div class="footbar"><button class="btn p" id="nx" disabled>Next ›</button><button class="btn" data-go="payouts">Cancel</button></div>`;
  const fi = $('#fi'), dz = $('#dz');
  const pick = fs => { SFI.files = [...fs].filter(f => /\.xlsx?$/i.test(f.name)); $('#fname').innerHTML = SFI.files.map(f => esc(f.name)).join('<br>'); $('#nx').disabled = !SFI.files.length; $('#imsg').innerHTML = SFI.files.length ? '' : '<div class="alert bad">Choose Excel files (.xlsx)</div>'; };
  $('#cf').onclick = () => fi.click();
  fi.onchange = () => { pick(fi.files); fi.value = ''; };
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); pick(e.dataTransfer.files); };
  $('#nx').onclick = async () => {
    const b = $('#nx'); b.disabled = true; b.textContent = 'Reading...';
    try { SFI.parsed = []; for (const f of SFI.files) { try { SFI.parsed.push(await readSteadfast(f)); } catch (e) { SFI.parsed.push({ file_name: f.name, statement_no: '', parcels: [], collected: 0, shipping: 0, cod_charge: 0, rounding: 0, bank_diff: 0, errors: [e.message] }); } } sfPreview(); }
    catch (e) { $('#imsg').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; b.disabled = false; b.textContent = 'Next ›'; }
  };
}
function sfCheck(p) {
  const errs = [...p.errors];
  if (!p.statement_no) errs.push('Statement number (SFC-...) is not in the file name. Enter it below.');
  const others = SFI.parsed.filter(x => x !== p);
  if (p.statement_no && (S.payouts.some(o => o.statement_no === p.statement_no) || others.some(x => x.statement_no === p.statement_no && SFI.parsed.indexOf(x) < SFI.parsed.indexOf(p)))) errs.push(p.statement_no + ' is already imported');
  const have = new Set(S.payouts.flatMap(o => o.parcels.map(c => c.consignment_id)));
  const dup = p.parcels.filter(c => have.has(c.consignment_id));
  if (dup.length) errs.push(`${dup.length} parcel(s) are already in another payout, for example ${dup[0].consignment_id}`);
  const le = lockErr('sales', p.parcels.map(c => c.delivered_at || c.created_at)); if (le) errs.push(le);
  return errs;
}
function sfPreview() {
  $('#s1').className = 'step done'; $('#s2').className = 'step on';
  const all = SFI.parsed.map(p => ({ p, errs: sfCheck(p) })), ok = all.filter(x => !x.errs.length);
  $('#ibody').innerHTML = `<div class="pc" style="max-width:1200px;margin:0 auto">
    ${all.map(({ p, errs }, i) => { const adv = p.parcels.filter(advanceFlag).length, canc = p.parcels.filter(c => !isCollected(c.delivery_status)).length;
      return `<div class="box" style="padding:16px 18px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><b style="font-size:15px;flex:1">${esc(p.statement_no || 'Statement number missing')}<span class="mut sm" style="font-weight:400;margin-left:8px">${esc(p.file_name)}</span></b>
        ${!p.statement_no && p.parcels.length ? `<input class="in" data-sn="${i}" placeholder="SFC-12345678" style="width:160px">` : ''}</div>
      ${errs.length ? `<div class="alert bad">${errs.map(esc).join('<br>')}</div>` : `<div class="alert ok">Verified. ${p.parcels.length} parcels, every amount is a valid number and every parcel is paid.</div>`}
      ${p.parcels.length ? `<div class="kv" style="margin-bottom:6px">
        <div><span>Cash Collected (${p.parcels.length - canc} delivered)</span><b>${money(p.collected)}</b></div><div><span>Delivery Bill (${p.parcels.length} parcels)</span><b>-${money(p.shipping)}</b></div>
        <div><span>COD Charge (${money(p.cod_charge)} rounded)</span><b>-${money(p.cod_charge + p.rounding)}</b></div><div><span>You Receive</span><b>${money(receiveOf(p))}</b></div></div>
        ${canc ? `<div class="hint">${canc} cancelled or returned parcel(s): no sale, the delivery charge is still an expense.</div>` : ''}
        ${adv ? `<div class="hint">${adv} parcel(s) with a COD of 1 taka (advance or replacement) will be marked "Check CRM".</div>` : ''}
        <div class="hint">Check that You Receive matches the amount on the Steadfast statement. If the bank pays a slightly different amount, the difference is fixed when you match the bank line.</div>` : ''}
      </div>`; }).join('')}
  </div>
  <div class="footbar"><button class="btn p" id="go" ${ok.length ? '' : 'disabled'}>Import ${ok.length} Payout(s)</button><button class="btn" id="bk">‹ Back</button><button class="btn" data-go="payouts">Cancel</button></div>`;
  $$('[data-sn]').forEach(el => el.onchange = () => { const m = el.value.match(/(\d{5,})/); SFI.parsed[+el.dataset.sn].statement_no = m ? 'SFC-' + m[1] : ''; sfPreview(); });
  $('#bk').onclick = sfConfigure;
  $('#go').onclick = async e => {
    e.target.disabled = true; e.target.textContent = 'Importing...';
    let n = 0, last = null;
    try {
      for (const { p } of ok) {
        const rec = { statement_no: p.statement_no, file_name: p.file_name, paid_date: '', bank_txn_id: '', collected: p.collected, shipping: p.shipping, cod_charge: p.cod_charge, rounding: p.rounding, bank_diff: 0, receive: receiveOf(p), parcels: p.parcels };
        const saved = await api('importPayout', payoutOut(rec));
        last = { ...rec, id: saved.id, imported_at: saved.imported_at }; S.payouts.push(last); n++;
      }
      note(`${n} payout(s) imported`); n === 1 ? go('payout', last.id) : go('payouts');
    } catch (err) { note('Import failed: ' + err.message, 1); if (n) go('payouts'); else { e.target.disabled = false; e.target.textContent = 'Try Again'; } }
  };
}

/* =========================================================================
   Sales: Sales Receipts, Credit Notes, Payments Received, Customer page,
   and CRM (Supabase) reconciliation with Steadfast payouts.
   Sales Receipt: Dr deposit account, Cr Sales. Credit Note (refund): Dr Sales, Cr refund account.

const docNo = (list, field, prefix) => prefix + String(list.reduce((mx, x) => Math.max(mx, Number((String(x[field]).match(/(\d+)\s*$/) || [])[1] || 0)), 0) + 1).padStart(5, '0');
function docEntries() {
  const out = [];
  for (const r of S.receipts) { out.push({ date: r.date, key: r.account, dr: r.amount, cr: 0, business: r.business || SALES_BIZ, src: 'receipt', r }); out.push({ date: r.date, key: 'Sales', dr: 0, cr: r.amount, business: r.business || SALES_BIZ, src: 'receipt', r }); }
  for (const n of S.creditnotes) { out.push({ date: n.date, key: 'Sales', dr: n.amount, cr: 0, business: n.business || SALES_BIZ, src: 'cn', r: n }); out.push({ date: n.date, key: n.account, dr: 0, cr: n.amount, business: n.business || SALES_BIZ, src: 'cn', r: n }); }
  return out;
}
function docBankLines(accId) {
  const k = '@' + accId;
  return [...S.receipts.filter(r => r.account === k).map(r => ({ id: 'sr-' + r.id, doc: 'receipt', docId: r.id, jv: 1, account_id: accId, date: r.date, seq: 0, label: 'Sales Receipt ' + r.receipt_no, description: r.notes || '', reference: r.invoice || '', debit: 0, credit: r.amount, balance: null, category: 'Sales', business: r.business || SALES_BIZ, party: r.customer, note: '' })),
    ...S.creditnotes.filter(n => n.account === k).map(n => ({ id: 'cn-' + n.id, doc: 'creditnote', docId: n.id, jv: 1, account_id: accId, date: n.date, seq: 0, label: 'Refund ' + n.cn_no, description: n.reason || '', reference: n.invoice || '', debit: n.amount, credit: 0, balance: null, category: 'Sales', business: n.business || SALES_BIZ, party: n.customer, note: '' }))];
}
const depositAccounts = sel => S.accounts.filter(a => a.active || '@' + a.id === sel).map(a => `<option value="@${a.id}" ${'@' + a.id === sel ? 'selected' : ''}>${esc(a.name)} (${esc(a.type)})</option>`).join('');
const custOptions = sel => S.customers.map(c => `<option ${c.name === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

function custStats(name) {
  const isSf = name === 'Steadfast';
  const payouts = isSf ? S.payouts : [];
  const receipts = S.receipts.filter(r => r.customer === name), cns = S.creditnotes.filter(n => n.customer === name);
  const sales = payouts.reduce((s, o) => s + o.collected, 0) + receipts.reduce((s, r) => s + r.amount, 0) - cns.reduce((s, n) => s + n.amount, 0);
  const receivable = payouts.filter(o => !o.bank_txn_id).reduce((s, o) => s + receiveOf(o), 0);
  return { payouts, receipts, cns, sales, receivable };
}

function rptForecast(M) {

  const val = (k, m) => { if (!B || +B.fiscal_year !== +m.slice(0, 4)) return 0; const n = PERIODS[B.period] || 12, per = 12 / n, i = Math.floor((+m.slice(5) - 1) / per); return Math.round(((B.values[k] || [])[i] || 0) / per); };

function salesFacts(from, to) { // every sale of Sharanga: Steadfast parcels by delivery date, sales receipts, credit notes
  const out = [];
  for (const o of S.payouts) for (const c of o.parcels) { const d = c.delivered_at || c.created_at; if (c.collected && inRange(d, from, to)) out.push({ date: d, cust: 'Steadfast', amount: c.collected, n: 1 }); }

}

function stockEvents() { // every stock movement of a tracked item, with its value (paisa) and quantity (thousandths)

  for (const b of S.bills) b.lines.forEach(l => { if (tracked.has(l.item) && l.account === INV_ACCOUNT) ev.push({ date: b.date, item: l.item, q: qtyK(l.qty), v: l.amount, kind: 'bill', ref: b.bill_no, who: b.vendor }); });
  for (const a of S.adjustments) a.lines.forEach((l, li) => { if (tracked.has(l.item)) ev.push({ date: a.date, item: l.item, q: qtyK(l.qty_change), v: values.get(a.id + ':' + li) || 0, kind: 'adj', ref: a.adj_no, who: a.reason, a }); });
  return ev;
}

}

        xl.push({ line: xl.length + 1, item: l.item, description: l.description || '', account: l.account, qty: q, unit: l.unit || (S.items.find(y => y.name === l.item) || {}).unit || '', rate: r, amount: Math.round(q * r) }); }
      const xav = String(x.adjVal || '').trim() ? parseAmt(x.adjVal) : 0, xov = String(x.oldVal || '').trim() ? parseAmt(x.oldVal) : 0;

      extra.push({ files: x.files || [], id: x.id || '', orig: x.orig || null, bill_no: xn, vendor: x.vendor, date: x.date, business: x.business || SALES_BIZ, notes: (x.notes || '').trim(), lines: xl, adj_account: xav ? x.adjAcc : '', adj_amount: xav, old_due_pay: xov });

/* =========================================================================
   Inventory (tracked raw materials). Moving average cost, exact in paisa:
   - a bill line of a tracked item adds quantity and its amount (Dr Inventory Asset)
   - a stock count / adjustment changes quantity; the value taken out is
     value_on_hand * qty_out / qty_on_hand (rounded to paisa), so stock value never drifts
   - Opening Stock: Dr Inventory Asset, Cr Opening Balance Offset
   - Stock Count (used in production) and Damaged: Dr Cost of Goods Sold, Cr Inventory Asset
   ========================================================================= */
const INV_ACCOUNT = 'Inventory Asset';
const ADJ_REASONS = ['Opening Stock', 'Stock Count', 'Damaged or Lost'];
const isTracked = name => !!(S.items.find(i => i.name === name) || {}).track;
const qtyK = q => Math.round(Number(q) * 1000); // quantities kept in thousandths so 2.5 ft stays exact
function inventoryState(upTo) {
  const st = new Map(S.items.filter(i => i.track).map(i => [i.name, { q: 0, v: 0 }]));
  const ev = [];
  for (const b of S.bills) b.lines.forEach((l, li) => { if (st.has(l.item) && l.account === INV_ACCOUNT) ev.push({ date: b.date, at: String(b.created_at || ''), k: 0, item: l.item, q: qtyK(l.qty), v: l.amount }); });
  for (const a of S.adjustments) a.lines.forEach((l, li) => { if (st.has(l.item)) ev.push({ date: a.date, at: String(a.created_at || ''), k: 1, item: l.item, q: qtyK(l.qty_change), a, li }); });
  ev.sort((x, y) => x.date.localeCompare(y.date) || x.at.localeCompare(y.at) || x.k - y.k); // same day: in the order they were entered
  const values = new Map(); // adjustment id + line -> value moved (paisa, signed)
  for (const e of ev) {
    if (upTo && e.date > upTo) break;
    const s = st.get(e.item);
    if (e.k === 0) { s.q += e.q; s.v += e.v; continue; }
    let dv;
    if (e.q >= 0) { const unit = s.q > 0 ? s.v / s.q : S.items.find(i => i.name === e.item).cost / 1000; dv = Math.round(unit * e.q); }
    else { dv = s.q + e.q <= 0 ? -s.v : -Math.round(s.v * -e.q / s.q); }
    s.q += e.q; s.v += dv; values.set(e.a.id + ':' + e.li, dv);
  }
  return { st, values };
}
function inventoryEntries() {
  const out = [], { values } = inventoryState('');
  for (const a of S.adjustments) {
    const v = a.lines.reduce((s, l, li) => s + (values.get(a.id + ':' + li) || 0), 0); if (!v) continue;
    const other = a.reason === 'Opening Stock' ? 'Opening Balance Offset' : 'Cost of Goods Sold', biz = a.reason === 'Opening Stock' ? '' : SALES_BIZ;
    out.push({ date: a.date, key: INV_ACCOUNT, dr: v > 0 ? v : 0, cr: v < 0 ? -v : 0, business: biz, src: 'adj', a });
    out.push({ date: a.date, key: other, dr: v < 0 ? -v : 0, cr: v > 0 ? v : 0, business: biz, src: 'adj', a });
  }
  return out;
}
const fmtQ = q => (Math.round(q) / 1000).toLocaleString('en-IN', { maximumFractionDigits: 3 });
function viewInventory() {
  const { st } = inventoryState(''), list = S.items.filter(i => i.track && i.active).sort((a, b) => a.name.localeCompare(b.name));
  const total = list.reduce((s, i) => s + st.get(i.name).v, 0), counted = S.adjustments.length > 0;
  $('#page').innerHTML = `<div class="ph"><h1>Inventory</h1><button class="btn p" id="nsc">${counted ? 'New Stock Count' : 'Enter Opening Stock'}</button></div>

/* =========================================================================
   Salary. Accrual, per person:
   - Post salary for a month: Dr "Salary - <Name>" (business), Cr Salaries Payable (employee)
   - Pay salary (form, or a bank line with Pay Salary): Dr Salaries Payable (employee), Cr account paid from

const PAYABLE = 'Salaries Payable';
const BOOKS_START_MONTH = '2026-11'; // books start on 31 Oct 2026; earlier months are from the old salary sheet
const ekey = s => String(s || '').trim().toLowerCase();
const salaryAcc = n => 'Salary - ' + n;
// salary months are named like his salary sheet: the books month 2026-11 is "Oct-Nov 2026" (2027-01 is "Dec 2026-Jan 2027")
const monthLabel2 = m => { const y = +m.slice(0, 4), i = +m.slice(5) - 1; if (m < BOOKS_START_MONTH) return MN[i] + ' ' + y; return i ? `${MN[i - 1]}-${MN[i]} ${y}` : `Dec ${y - 1}-Jan ${y}`; };

const spValid = p => !p.txn_id || S.transactions.some(t => t.id === p.txn_id && (t.category === PAYABLE || (t.category === 'Accounts Payable' && vpOf(t)))); // a line that paid a bill and salaries together stays on Accounts Payable // a payment whose bank line was removed (undo import) or recategorized no longer counts
const isReqTx = t => t.category === PAYABLE && S.salpayments.some(p => p.txn_id === t.id);
const reqTotal = r => r.lines.reduce((s, l) => s + l.amount, 0);
const reqPaid = (r, emp) => S.salpayments.filter(p => p.request_id === r.id && spValid(p) && (emp === undefined || ekey(p.employee) === ekey(emp))).reduce((s, p) => s + p.amount, 0);
const reqLeft = r => reqTotal(r) - reqPaid(r);
const reqStatus = r => { const pd = reqPaid(r); return pd <= 0 ? 'Open' : pd < reqTotal(r) ? 'Partially Paid' : 'Paid'; };
const reqOpen = () => S.salrequests.filter(r => reqLeft(r) > 0).sort((a, b) => a.date.localeCompare(b.date));
const REQ_DAYS = 7; // the money is sent on the request date or within 7 days after
const inReqWindow = (r, t) => t.date >= r.date && (new Date(t.date) - new Date(r.date)) / 864e5 <= REQ_DAYS;
const reqAlloc = (r, amount, skipTxn) => { let rest = amount; return r.lines.map(l => { const left = l.amount - S.salpayments.filter(p => p.request_id === r.id && spValid(p) && p.txn_id !== skipTxn && ekey(p.employee) === ekey(l.employee)).reduce((s, p) => s + p.amount, 0), a = Math.max(0, Math.min(left, rest)); rest -= a; return { employee: l.employee, left, amount: a }; }); };
async function unlinkReqTxn(t) {

  await api('unlinkSalaryTxn', { txn_id: t.id }); S.salpayments = S.salpayments.filter(p => !(p.txn_id === t.id && !p.bank_ref)); S.salpayments.forEach(p => { if (p.txn_id === t.id) p.txn_id = ''; }); // a recorded payment stays, only its link goes
}
async function linkReqTxn(t, r, allocs) {

    const rec = { id: '', payment_no: docNo(S.salpayments, 'payment_no', 'SP-'), employee: a.employee, date: t.date, account: '@' + t.account_id, amount: a.amount, notes: 'Request ' + r.req_no, request_id: r.id, txn_id: t.id };

/* HIS RULE (2 Nov 2026): a salary payment is recorded on the request with the bank reference from the screenshot.
   The statement line with that exact reference AND the same amount becomes that payment. Never matched by amount alone. */
function spGroups() { // the person payments of one recorded payment share account + bank reference
  const m = new Map();
  S.salpayments.filter(p => p.bank_ref).forEach(p => { const k = p.account + '|' + refKey(p.bank_ref); if (!m.has(k)) m.set(k, { key: k, account: p.account, ref: p.bank_ref, pays: [] }); m.get(k).pays.push(p); });
  return [...m.values()].map(g => ({ ...g, amount: g.pays.reduce((s, p) => s + p.amount, 0), txn: g.pays.every(p => p.txn_id && p.txn_id === g.pays[0].txn_id) && spValid(g.pays[0]) ? g.pays[0].txn_id : '' }));
}

}

  await saveTxn([t.id], { category: PAYABLE, business: '', party: r ? r.req_no : g.pays.map(p => p.employee).join(', '), note: t.note || ('Salary ' + g.pays.map(p => p.payment_no).join(', ')) });

async function autoMatchSalaryRequests() { // runs on start, after an import, after adding a line, after recording a payment

    if (c.length === 1 && c[0].debit === g.amount && !lockErr('banking', [c[0].date])) { await linkSpGroup(g, c[0]); n++; } }
