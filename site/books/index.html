/* HIS RULE (31 Oct 2026): salary is an expense the moment it is PAID, so the budget goes down at once.
   The salary sheet only says what each person is owed per month; posting a month is not an expense.
   Each payment pays: this and earlier book months (oldest first), then the old dues from before the books, then the next months.
   The part that pays a book month is "Salary - <Name>" expense; the part that pays an old due lowers Salaries Payable (the opening due). */
const curMonth = () => today().slice(0, 7);
function empCalc(name) {
  const k = ekey(name), rows = new Map(), e = S.employees.find(x => ekey(x.name) === k) || {};
  const row = (m, label) => { if (!rows.has(m)) rows.set(m, { month: m, label: label || monthLabel2(m), salary: 0, paid: 0, settled: 0 }); return rows.get(m); };
  let hsum = 0;
  S.salhistory.filter(h => ekey(h.name) === k).forEach(h => { const x = row(h.month, h.label); x.salary += h.total; x.paid += h.paid; x.old = true; hsum += h.total - h.paid; });
  if ((e.opening_due || 0) !== hsum) { const x = row('0000-00', 'Due on ' + dt(OPENING_AS_OF)); x.salary += (e.opening_due || 0) - hsum; x.old = true; }
  for (const r of S.payroll) r.lines.filter(l => ekey(l.employee) === k).forEach(l => { const x = row(r.month); x.salary += l.amount; x.business = l.business; x.posted = true; });
  if (e.active) for (let m = BOOKS_START_MONTH; m <= curMonth(); m = nextMonth(m)) if (!S.payroll.some(r => r.month === m) && !rows.has(m)) { const x = row(m); x.salary = e.monthly_salary; x.implied = true; } // a month not posted yet is owed at the monthly salary
  S.settlements.filter(x => ekey(x.employee) === k).forEach(x => { const r = row(x.month); r.settled += x.amount; r.reasons = [...(r.reasons || []), x.reason]; });
  const pays = [...S.salpayments.filter(p => ekey(p.employee) === k && spValid(p)).map(p => ({ date: p.date, amount: p.amount, p })),
    ...S.transactions.filter(t => ekey(empOfTx(t)) === k).map(t => ({ date: t.date, amount: t.debit, t }))].sort((a, b) => a.date.localeCompare(b.date));
  const list = () => [...rows.values()].sort((a, b) => a.month.localeCompare(b.month)), left = x => x.salary - x.paid - x.settled, pieces = [];
  for (const pay of pays) {
    let a = pay.amount; const pm = pay.date.slice(0, 7);
    const give = (x, g) => { if (g <= 0) return; x.paid += g; a -= g; pieces.push({ ...pay, amount: g, month: x.month, old: x.month < BOOKS_START_MONTH, business: (pay.t && pay.t.category !== PAYABLE && pay.t.business) || x.business || e.business || '' }); };
    const book = list().filter(x => x.month >= BOOKS_START_MONTH);

    list().filter(x => x.month < BOOKS_START_MONTH).forEach(x => give(x, Math.min(a, Math.max(0, left(x)))));

const salLabel = label => { const s = String(label || ''), i = s.lastIndexOf('-'); return i < 0 ? esc(s) : `${esc(s.slice(0, i + 1))}<span style="color:var(--red)">${esc(s.slice(i + 1))}</span>`; };

const nextMonth = m => { const y = +m.slice(0, 4), i = +m.slice(5); return i === 12 ? `${y + 1}-01` : `${y}-${String(i + 1).padStart(2, '0')}`; };
/* HIS RULE (3 Nov 2026): a bank withdrawal on "Salary - <Name>" is a salary payment to that person, the same as Salaries Payable + Paid To.

      <tr class="net"><td>Net Profit/Loss${pays.length ? ' Before Loan Repayments' : ''}</td><td class="r" style="color:${net < 0 ? 'var(--red)' : 'var(--green)'}">${money(net)}</td></tr>
      ${pays.length ? `${block('Loan Repayments and Other Payments', pays)}
      <tr class="net"><td>Net Profit/Loss After Loan Repayments</td><td class="r" style="color:${net - sum(pays) < 0 ? 'var(--red)' : 'var(--green)'}">${money(net - sum(pays))}</td></tr>` : ''}</tbody></table>
      ${pays.length ? '<div class="hint" style="margin-top:8px">Loan repayments and other budgeted payments are taken out here so every budget line counts. The loan balances in the Balance Sheet go down as normal.</div>' : ''}</div>
  </div>`;
  $$('#bz div').forEach(d => d.onclick = () => { RP.biz = d.dataset.b; viewReport(); }); bindBasis('pbas', viewReport); drillBind();
  $('#pp').onchange = e => { RP.period = e.target.value; if (RP.period === 'custom' && !RP.from) { const d = new Date(); RP.from = new Date(Date.UTC(d.getFullYear(), d.getMonth(), 1)).toISOString().slice(0, 10); RP.to = today(); } viewReport(); };
  if ($('#pf')) { $('#pf').onchange = e => { RP.from = e.target.value; viewReport(); }; $('#pt').onchange = e => { RP.to = e.target.value; viewReport(); }; }
}

/* ---------- Settings ---------- */
function viewSettings() {
  const c = cfg();
  $('#page').innerHTML = `<div class="ph"><h1>Settings</h1></div><div class="pc" style="max-width:760px">
    <div class="sect" style="margin-top:0">Google Sheet Connection</div>
    ${live() ? '' : `<div class="frow"><label>Web App URL</label><input class="in" id="s1" value="${esc(c.url || LIVE_URL)}" placeholder="https://script.google.com/macros/s/.../exec"></div>`}
    ${live() ? `<div class="frow"><label>Signed In As</label><div style="padding-top:8px"><b>${esc(c.user || 'admin')}</b></div></div>
    <div class="frow"><label></label><div style="display:flex;gap:8px"><button class="btn" id="sout">Sign Out</button></div></div>` : `<div class="frow"><label>Username</label><input class="in" id="s2" autocomplete="username" style="max-width:260px"></div>
    <div class="frow"><label>Password</label><input class="in" id="s3" type="password" autocomplete="current-password" style="max-width:260px"></div>
    <div class="frow"><label></label><div style="display:flex;gap:8px"><button class="btn p" id="ss">Sign In and Connect</button></div></div>`}
    <div class="hint">${live() ? 'Connected. All data is saved in your Google Sheet. Anyone who opens the app must sign in.' : 'Not connected. Data is saved only in this browser until you connect the sheet.'}</div>
    ${live() && c.user ? `<div class="sect">Change Password</div>
    <div class="frow"><label>Current Password</label><input class="in" id="cp1" type="password" autocomplete="current-password" style="max-width:260px"></div>
    <div class="frow"><label>New Password</label><input class="in" id="cp2" type="password" autocomplete="new-password" style="max-width:260px"></div>
    <div class="frow"><label>Confirm New Password</label><input class="in" id="cp3" type="password" autocomplete="new-password" style="max-width:260px"></div>
    <div class="frow"><label></label><button class="btn" id="cpb">Change Password</button></div>` : ''}
    ${crmSettingsHTML()}
    <div class="sect">Businesses</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${S.businesses.map(bizTag).join('')}</div>
    <div style="display:flex;gap:8px"><input class="in" id="bn2" placeholder="New business name"><button class="btn" id="ba">Add</button></div>
    ${!live() || localStorage.getItem('books_local') ? `<div class="sect">Data in this browser</div>
    ${live() ? '<div class="hint" style="margin-bottom:10px">Entries made before the app was connected to the Google Sheet are still kept in this browser. Download them to move them into the sheet.</div>' : ''}
    <div style="display:flex;gap:8px"><button class="btn" id="ex">Download Backup (JSON)</button><button class="btn" id="rs" style="color:var(--red)">Reset Browser Data</button></div>` : ''}
    <div class="sect">Start Fresh</div>
    <div class="hint" style="margin-bottom:10px">Deletes every transaction: bank and cash lines, statement imports, manual journals, Steadfast payouts and parcels, sales receipts and credit notes. Bank opening balances go back to 0 (the next statement sets them again). Accounts, Chart of Accounts, rules, budgets, customers and locks are kept.</div>
    <button class="btn" id="clr" style="color:var(--red)">Delete All Transactions</button></div>`;
  if ($('#ss')) $('#ss').onclick = async () => {
    const url = $('#s1').value.trim(), u = $('#s2').value.trim(), pw = $('#s3').value;
    if (!url || !u || !pw) return note('Web App URL, username and password are required', 1);
    const old = cfg();
    try { await signIn(url, u, pw); await load(); note('Connected to Google Sheet'); location.reload(); } catch (e) { store.set('books_cfg', old); note('Could not connect: ' + e.message, 1); }
  };
  if ($('#sout')) $('#sout').onclick = signOut;
  if ($('#so')) $('#so').onclick = async () => { try { await Remote.call('logout', {}); } catch (e) { } store.set('books_cfg', { url: '', key: '' }); await load(); note('Disconnected'); render(); };
  if ($('#cpb')) $('#cpb').onclick = async () => {
    const a = $('#cp1').value, b = $('#cp2').value; if (!a || !b) return note('Enter the current and the new password', 1);
    if (b !== $('#cp3').value) return note('The new passwords do not match', 1); if (b.length < 8) return note('The new password needs at least 8 characters', 1);
    try { await Remote.call('changePassword', { old: a, password: b }); note('Password changed. Please sign in again.'); setTimeout(() => { store.set('books_cfg', { ...cfg(), key: '' }); location.reload(); }, 900); } catch (e) { note(e.message, 1); }
  };
  bindCrmSettings();
  $('#ba').onclick = async () => { const name = $('#bn2').value.trim(); if (!name) return; try { await api('saveBusiness', { name }); S.businesses.push(name); note('Business added'); viewSettings(); } catch (e) { note(e.message, 1); } };
  if ($('#ex')) $('#ex').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(Local.db(), null, 2)], { type: 'application/json' })); a.download = 'books-backup.json'; a.click(); };
  $('#clr').onclick = async () => {
    if (prompt('This deletes every transaction' + (live() ? ' in your Google Sheet' : ' in this browser') + '. Type DELETE to continue') !== 'DELETE') return;
    try { const r = await api('clearTransactions', {}); await load(); note(`${r.deleted} records deleted`); go('banking'); } catch (e) { note(e.message, 1); }
  };
  if ($('#rs')) $('#rs').onclick = async () => { if (prompt('Type RESET to delete all data saved in this browser') !== 'RESET') return; localStorage.removeItem('books_local'); await load(); note('Browser data reset'); go('banking'); };
}

/* ---------- start ---------- */
$('#qplus').onclick = quickCreate;
$('#av').onclick = e => { e.stopPropagation(); rowMenu($('#av'), live() ? [['', `Signed in as ${esc(cfg().user || 'admin')}`], ['out', 'Sign Out']] : [['', 'Saved in this browser']], k => { if (k === 'out') signOut(); }); };
$('#mnav').onclick = () => document.body.classList.toggle('navopen'); document.addEventListener('click', e => { if (document.body.classList.contains('navopen') && !e.target.closest('#side') && !e.target.closest('#mnav')) document.body.classList.remove('navopen'); });
$('#nback').onclick = () => navStep(-1); $('#nfwd').onclick = () => navStep(1);
$('#gsearch').onkeydown = e => { if (e.key === 'Enter') { GQ = e.target.value; go('search'); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); $$('.mbg').forEach(m => m.remove()); } if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#gsearch').focus(); } });
(async () => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('bill')) { // a shared bill link
    if (!live() || !cfg().key) { location.replace((cfg().url || LIVE_URL) + location.search); return; } // not signed in here: the public bill page, as before
    PAYLINK = true; history.replaceState(null, '', location.pathname + '#billgroup/' + encodeURIComponent(qs.get('bill')));
  }
  if (live() && !cfg().key) return showLogin();
  if (live() && cfg().user) $('#av').textContent = cfg().user.slice(0, 1).toUpperCase();
  const h = (location.hash || '').slice(1).split('/');
  if (h[0] && ['invest', 'banking', 'account', 'import', 'rules', 'chart', 'coa', 'journals', 'journal', 'jform', 'bulk', 'budgets', 'budget', 'budgetedit', 'bva', 'locking', 'customers', 'customer', 'receipts', 'receipt', 'receiptform', 'payments', 'creditnotes', 'creditnote', 'cnform', 'recon', 'parcels', 'payouts', 'payout', 'sfimport', 'reports', 'pnl', 'rpt', 'home', 'documents', 'employees', 'employee', 'payroll', 'salpayments', 'salpayment', 'settlements', 'salreqs', 'salreq', 'salreqform', 'salpublish', 'items', 'inventory', 'adjustments', 'adj', 'adjform', 'vendors', 'vendor', 'bills', 'bill', 'billgroup', 'billform', 'vpayments', 'vpayment', 'reports', 'settings'].includes(h[0])) R = { name: h[0], arg: h[1] ? decodeURIComponent(h[1]) : null };
  navInit();
  const cached = live() ? await cacheGet() : null; // the app copy already holds every change made in this browser (unsent ones wait in the outbox)
  if (cached && (cached.s || (cached.d && !store.get('books_cache_dirty', 0)))) { // instant: last copy now, the sheet in the background
    try { if (cached.s) S = cached.s; else applyData(cached.d); render(); outboxRun(); LAST_SYNC = Date.now() - 60000; syncNow(); vqResume(); pdfjs().catch(() => {}); return; } catch (e) { await cacheClear(); }
  }
  outboxRun();
  $('#page').innerHTML = '<div class="empty" style="padding-top:140px"><h3 style="font-size:18px">Loading your books...</h3><div class="mut">Opening your books for the first time in this browser. After this the app opens at once.</div></div>';
  try { await load(); await autoMatchSalaryRequests(); await matchVendorPayments(); await autoTransfers(); syncBillStates(); } catch (e) { if (e.auth) return; if (!TEST_MODE) return loadFailed(e.message); note('Could not reach Google Sheet, using this browser: ' + e.message, 1); store.set('books_cfg', { url: '', key: '' }); await load(); }
  LAST_SYNC = Date.now(); render(); vqResume();
  pdfjs().catch(() => {}); // warm up the PDF reader in the background
})();
</script>
