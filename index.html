<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Apps</title>
<script src="/assets/supabase.js"></script>
<script src="/assets/auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:#fff;background:#070b18;overflow-x:hidden}
.hidden{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 18s ease-in-out infinite alternate;z-index:0;pointer-events:none}
.g1{width:540px;height:540px;background:#3b5bff;top:-160px;left:-140px}
.g2{width:480px;height:480px;background:#c03a7a;bottom:-180px;right:-120px;animation-delay:-6s}
.g3{width:360px;height:360px;background:#0fb6a6;top:42%;left:52%;animation-delay:-11s;opacity:.32}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.12)}100%{transform:translate(-40px,70px) scale(.95)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
.grad{background:linear-gradient(90deg,#8fa2ff,#ff8fc4,#7ff0e0,#8fa2ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
.view{position:relative;z-index:2;min-height:100vh}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:14px}
.kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#9fb0ff}
.quote{min-height:52px;font-size:17px;line-height:1.55;color:#c9d2f5;max-width:520px;transition:opacity .6s,transform .6s}
.quote.out{opacity:0;transform:translateY(8px)}
.mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:linear-gradient(135deg,#4b6bff,#b23fd1);box-shadow:0 8px 24px rgba(91,96,255,.4)}

/* gate */
#v-gate{display:flex;align-items:center;justify-content:center;padding:32px}
.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;max-width:1080px;width:100%}
.hero .kicker{margin-bottom:18px;opacity:0;animation:up .8s .1s forwards}
.hero h2{font-size:48px;line-height:1.06;font-weight:700;letter-spacing:-1px;margin-bottom:18px;opacity:0;animation:up .8s .25s forwards}
.stats{display:flex;gap:28px;margin-top:34px;opacity:0;animation:up .8s .55s forwards}
.stat b{display:block;font-size:24px;font-weight:700}
.stat small{color:#8d97bd;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase}
.card{width:380px;max-width:100%;padding:34px 32px 30px;justify-self:end;opacity:0;animation:up .9s .35s forwards}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand b{font-size:19px;font-weight:600}
.card h1{font-size:24px;font-weight:600;margin-bottom:6px}
.sub{color:#aab3d6;margin-bottom:20px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{color:#aab3d6;font-size:13px}
.field input{height:44px;border-radius:8px;padding:0 12px;outline:none;font:inherit;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;letter-spacing:.5px}
.field input:focus{border-color:#8fa2ff;box-shadow:0 0 0 3px rgba(143,162,255,.18)}
.btn{width:100%;height:44px;border:none;border-radius:8px;cursor:pointer;font:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(90deg,#4b6bff,#b23fd1);box-shadow:0 10px 30px rgba(91,96,255,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(91,96,255,.5)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.err{color:#ff9aa8;text-align:center;margin-top:12px;min-height:18px;font-size:13px}
.foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#5d6790;font-size:11.5px;z-index:2}

/* apps */
#v-apps{padding:0 28px 60px}
.top{display:flex;align-items:center;gap:12px;height:72px;max-width:1080px;margin:0 auto}
.top b{font-size:18px;font-weight:600}
.top .right{margin-left:auto;display:flex;align-items:center;gap:14px;color:#aab3d6;font-size:13px}
.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#e6e8f0;border-radius:8px;height:34px;padding:0 14px;cursor:pointer;font:inherit;font-size:13px;transition:background .15s}
.ghost:hover{background:rgba(255,255,255,.16)}
.welcome{max-width:1080px;margin:56px auto 0;opacity:0;animation:up .8s .1s forwards}
.welcome .kicker{margin-bottom:14px}
.welcome h2{font-size:42px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-bottom:14px}
.clock{color:#8d97bd;font-size:13px;margin-top:10px}
.grid{max-width:1080px;margin:44px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.tile{position:relative;display:block;padding:28px;text-decoration:none;color:#fff;overflow:hidden;opacity:0;animation:up .8s forwards;transition:transform .25s,box-shadow .25s,border-color .25s}
.tile::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;background:linear-gradient(120deg,transparent 30%,rgba(143,162,255,.9),rgba(255,143,196,.9),transparent 70%);background-size:250% 250%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:sweep 4s linear infinite}
@keyframes sweep{to{background-position:250% 250%}}
.tile:hover{transform:translateY(-6px);box-shadow:0 40px 90px rgba(0,0,0,.55)}
.tile:hover::before{opacity:1}
.tile .ic{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;margin-bottom:22px}
.tile h3{font-size:20px;font-weight:600;margin-bottom:8px}
.tile p{color:#aab3d6;font-size:13.5px;line-height:1.55;margin-bottom:22px}
.tile .go{font-size:13px;color:#c9d2ff;display:flex;align-items:center;gap:8px}
.tile .go i{transition:transform .2s;font-style:normal}
.tile:hover .go i{transform:translateX(5px)}
@media (max-width:860px){.stage{grid-template-columns:1fr;gap:28px}.hero h2{font-size:32px}.stats{display:none}.card{justify-self:center}.welcome h2{font-size:30px}}
@media (prefers-reduced-motion:reduce){.glow,.grad,.tile::before{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<div id="v-gate" class="view hidden">
  <div class="stage">
    <div class="hero">
      <div class="kicker">Sharanga · Mynflow</div>
      <h2>Build it again.<br><span class="grad">Bigger this time.</span></h2>
      <div class="quote" data-quote></div>
      <div class="stats">
        <div class="stat"><b>One</b><small>Team</small></div>
        <div class="stat"><b>Every</b><small>Order counts</small></div>
        <div class="stat"><b>Today</b><small>Is day one</small></div>
      </div>
    </div>
    <div class="card glass">
      <div class="brand"><div class="mark">OA</div><b>Our Apps</b></div>
      <h1>Welcome back</h1>
      <div class="sub">Enter the team password to open your apps</div>
      <form id="f" autocomplete="on">
        <input type="text" name="username" value="team" autocomplete="username" hidden>
        <div class="field"><label for="p">Team password</label><input id="p" type="password" autocomplete="current-password" required></div>
        <button class="btn" id="go" type="submit">Enter</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>
  <div class="foot">Every reply, every parcel, every taka moves us forward.</div>
</div>

<div id="v-apps" class="view hidden">
  <div class="top"><div class="mark">OA</div><b>Our Apps</b>
    <div class="right"><span id="today"></span><button class="ghost" onclick="SKAUTH.signOutAll()">Lock</button></div></div>
  <div class="welcome">
    <div class="kicker" id="greet"></div>
    <h2>What are we <span class="grad">winning</span> today?</h2>
    <div class="quote" data-quote></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
var APPS = [
  { href: '/crm/', name: 'Sharanga CRM', desc: 'Orders, Omnichannel Inbox, reminders, sales, manufacturing cost and SKU analytics.', ic: 'SK', bg: 'linear-gradient(135deg,#ff6f9f,#c03a7a)' },
  { href: '/books/', name: 'Books', desc: 'Accounting for Sharanga and Mynflow: banking, bills, sales, budget and reports.', ic: 'B', bg: 'linear-gradient(135deg,#5b7cff,#2c4bd8)' }
];
function nextUrl() {
  var n = new URLSearchParams(location.search).get('next') || '';
  return /^\/(crm|books)\//.test(n) ? n : '';
}
function showApps() {
  var n = nextUrl(); if (n) { location.replace(n); return; }
  var h = new Date().toLocaleString('en-GB', { timeZone: 'Asia/Dhaka', hour: 'numeric', hour12: false }) * 1;
  document.getElementById('greet').textContent = h < 12 ? 'Good morning, team' : h < 17 ? 'Good afternoon, team' : 'Good evening, team';
  document.getElementById('today').textContent = new Date().toLocaleDateString('en-GB', { timeZone: 'Asia/Dhaka', weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('grid').innerHTML = APPS.map(function (a, i) {
    return '<a class="tile glass" style="animation-delay:' + (0.25 + i * 0.12) + 's" href="' + a.href + '"><div class="ic" style="background:' + a.bg + '">' + a.ic + '</div><h3>' + a.name + '</h3><p>' + a.desc + '</p><div class="go">Open <i>→</i></div></a>';
  }).join('');
  document.getElementById('v-gate').classList.add('hidden');
  document.getElementById('v-apps').classList.remove('hidden');
}
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
  try { await SKAUTH.gateSignIn(document.getElementById('p').value); showApps(); }
  catch (x) { err.textContent = /Invalid login/i.test(x.message) ? 'Wrong team password.' : x.message; }
  btn.disabled = false; btn.textContent = 'Enter';
});
(async function () {
  var ok = false; try { ok = await SKAUTH.gateOk(); } catch (e) {}
  if (ok) showApps(); else { document.getElementById('v-gate').classList.remove('hidden'); document.getElementById('p').focus(); }
})();

(function () {
  var Q = [
    'Started with 300 taka. Built a team of fifty. We know the way up.',
    'Every customer who waits is a sale we can still win. Reply first.',
    'Small wins every day become the comeback story.',
    'Discipline is doing the follow-up even when nobody is watching.',
    'We do not chase luck. We chase the next order, then the next one.',
    'Falling down was a chapter. Rising again is the book.'
  ];
  var els = document.querySelectorAll('[data-quote]'), i = Math.floor(Math.random() * Q.length);
  function show() { els.forEach(function (el) { el.classList.add('out'); }); setTimeout(function () { els.forEach(function (el) { el.textContent = Q[i % Q.length]; el.classList.remove('out'); }); i++; }, 600); }
  show(); setInterval(show, 6000);

  var c = document.getElementById('bg'), x = c.getContext('2d'), W, H, P = [], DPR = Math.min(window.devicePixelRatio || 1, 2), mx = -999, my = -999;
  function size() { W = c.clientWidth; H = c.clientHeight; c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0);
    var n = Math.round(Math.min(90, W * H / 16000)); P = [];
    for (var k = 0; k < n; k++) P.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, r: Math.random() * 1.6 + .6 }); }
  window.addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
  function tick() {
    x.clearRect(0, 0, W, H);
    for (var a = 0; a < P.length; a++) {
      var p = P[a]; p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      var dm = Math.hypot(p.x - mx, p.y - my); if (dm < 140 && dm > 0) { p.x += (p.x - mx) / dm * .6; p.y += (p.y - my) / dm * .6; }
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fillStyle = 'rgba(190,205,255,.75)'; x.fill();
      for (var b = a + 1; b < P.length; b++) {
        var q = P[b], d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < 120) { x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.strokeStyle = 'rgba(143,162,255,' + (1 - d / 120) * .28 + ')'; x.lineWidth = 1; x.stroke(); }
      }
    }
    requestAnimationFrame(tick);
  }
  size(); window.addEventListener('resize', size);
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) tick();
})();
</script>
</body>
</html>
